name: Tester le catalogue Awin léger

on:
  push:
    branches: [perf/compact-awin-catalogue-feed]
    paths:
      - "catalogue.html"
      - "scripts/build_awin_catalogue.mjs"
      - "scripts/build_awin_catalogue.test.mjs"
      - ".github/workflows/test-compact-awin-catalogue.yml"
      - ".github/workflows/sync-awin-products.yml"
  pull_request:
    paths:
      - "catalogue.html"
      - "scripts/build_awin_catalogue.mjs"
      - "scripts/build_awin_catalogue.test.mjs"
      - ".github/workflows/test-compact-awin-catalogue.yml"
      - ".github/workflows/sync-awin-products.yml"

permissions:
  contents: read

jobs:
  compact-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe et les tests unitaires
        run: |
          node --check scripts/build_awin_catalogue.mjs
          node --test scripts/build_awin_catalogue.test.mjs
      - name: Construire le flux compact depuis le vrai snapshot Awin
        run: node scripts/build_awin_catalogue.mjs
      - name: Vérifier la cohérence du flux compact réel
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const source = JSON.parse(fs.readFileSync("data/awin-products.json", "utf8"));
          const compact = JSON.parse(fs.readFileSync("data/awin-catalogue.json", "utf8"));
          const expected = source.products.filter(p =>
            p && p.id && p.name && p.merchant && /^https:\/\//i.test(String(p.sourceUrl || "")) &&
            /^https:\/\//i.test(String(p.image || "")) && !/unsplash\.com/i.test(String(p.image || "")) &&
            ["manufacturer_verified","official_press_image","retailer_product_image","authorized_feed_image"].includes(p.imageStatus) &&
            p.imageKind !== "illustration"
          );
          const sourceById = new Map(expected.map(p => [String(p.id), p]));
          const seen = new Set();
          if (compact.image_policy !== "authorized_feed_images_only" ||
              compact.source_product_count !== source.products.length ||
              compact.fetched_at !== source.fetched_at ||
              compact.products.length !== expected.length) {
            throw new Error("Le snapshot compact ne correspond pas à la source Awin.");
          }
          for (const product of compact.products) {
            const id = String(product.id);
            const original = sourceById.get(id);
            if (!original || seen.has(id)) throw new Error("Identité produit absente ou dupliquée dans le flux compact.");
            seen.add(id);
            for (const field of ["name","image","sourceUrl","merchant","priceValue","priceTaxStatus","merchantUpdatedAt","shippingPriceValue","availability","gtin","mpn","category","brand","product_type"]) {
              if (product[field] !== original[field]) throw new Error("Champ source modifié : " + field + " (" + id + ").");
            }
          }
          const bytes = fs.statSync("data/awin-catalogue.json").size;
          if (!compact.products.length || bytes > 16 * 1024 * 1024) {
            throw new Error("Le flux compact est vide ou dépasse 16 Mio.");
          }
          const html = fs.readFileSync("catalogue.html", "utf8");
          if (!html.includes('fetch("/data/awin-catalogue.json"') ||
              !html.includes('fetch("/data/awin-products.json"')) {
            throw new Error("Le catalogue ne possède pas les deux chemins compact et secours.");
          }
          console.log("Flux compact réel validé :", compact.products.length, "fiches ;", bytes, "octets ;", seen.size, "identités exactes préservées.");
          NODE
