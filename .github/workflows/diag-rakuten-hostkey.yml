name: Diagnostic clé hôte Rakuten (lecture seule)
on:
  push:
    branches: [diag/rakuten-hostkey]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet paramiko cryptography
      - name: Résolution DNS
        run: getent ahosts aftp.linksynergy.com | sort -u || true
      - name: Clés présentées par le serveur et comparaison aux empreintes officielles
        run: python3 scripts/rakuten-hostkey-diagnostic.py aftp.linksynergy.com 22
      - name: Toutes les clés via ssh-keyscan (RSA comprise), toutes les formes
        run: |
          for port in 22 2222; do
            echo "### port $port"
            ssh-keyscan -T 10 -p $port -t rsa,ecdsa,ed25519 aftp.linksynergy.com 2>/dev/null | python3 scripts/rakuten-hostkey-variants.py || true
          done
      - name: Certificat TLS FTPS (port 21, AUTH TLS) comparé aux empreintes officielles
        run: |
          for mode in "-starttls ftp -connect aftp.linksynergy.com:21" "-connect aftp.linksynergy.com:990"; do
            echo "### openssl s_client $mode"
            echo | timeout 20 openssl s_client $mode -servername aftp.linksynergy.com -showcerts 2>/dev/null > /tmp/s.txt || true
            awk '/BEGIN CERT/,/END CERT/' /tmp/s.txt | awk 'BEGIN{n=0}/BEGIN CERT/{n++}{print > "/tmp/cert" n ".pem"}'
            for c in /tmp/cert*.pem; do
              [ -s "$c" ] || continue
              openssl x509 -in "$c" -noout -subject -issuer -enddate
              s256=$(openssl x509 -in "$c" -outform DER | sha256sum | cut -d' ' -f1)
              s1=$(openssl x509 -in "$c" -outform DER | sha1sum | cut -d' ' -f1)
              echo "   CERT SHA256=$s256 SHA1=$s1"
              [ "$s256" = 6854993e0f41078a1f007d677d298c2a4f7d5f898de149f53e27d3159e4b2bdc ] && echo "   >>> CORRESPONDANCE SHA256 officielle"
              [ "$s1" = d98a0cdd102177804f99a3534a4a04c6b31ce816 ] && echo "   >>> CORRESPONDANCE SHA1 officielle"
              rm -f "$c"
            done
          done
      - name: Ports ouverts et bannières
        run: |
          for p in 21 22 990 2222; do
            printf "port %s : " $p
            timeout 8 bash -c "exec 3<>/dev/tcp/aftp.linksynergy.com/$p && timeout 4 head -c 120 <&3 | tr -d '\r\n'; echo" 2>&1 || echo "fermé/filtré"
          done
          echo | timeout 20 openssl s_client -starttls ftp -connect aftp.linksynergy.com:21 2>&1 | head -15 || true
