name: Importer les catalogues Rakuten autorisés

on:
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * *"
  pull_request:
    paths:
      - ".github/workflows/import-rakuten-catalogue.yml"
      - "scripts/import-rakuten-catalogue.py"
      - "tests/test_import_rakuten_catalogue.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-rakuten-catalogue.yml"
      - "scripts/import-rakuten-catalogue.py"

permissions:
  contents: write

concurrency:
  group: rakuten-catalogue-import
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Vérifier le parseur et les tests hors ligne
        run: |
          python3 -m py_compile scripts/import-rakuten-catalogue.py
          python3 -m unittest discover -s tests -p 'test_import_rakuten_catalogue.py' -v

  import:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Vérifier la configuration SFTP sécurisée sans afficher les valeurs
        id: config
        env:
          RAKUTEN_SFTP_USER: ${{ secrets.RAKUTEN_SFTP_USER }}
          RAKUTEN_SFTP_PASSWORD: ${{ secrets.RAKUTEN_SFTP_PASSWORD }}
          RAKUTEN_SFTP_KNOWN_HOSTS: ${{ vars.RAKUTEN_SFTP_KNOWN_HOSTS }}
          RAKUTEN_DATE_FORMAT: ${{ vars.RAKUTEN_DATE_FORMAT || 'MM/DD/YYYY' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RAKUTEN_SFTP_USER:-}" || -z "${RAKUTEN_SFTP_PASSWORD:-}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Import Rakuten bloqué : identifiants SFTP manquants ; snapshot précédent conservé."
            echo "- Import Rakuten bloqué : identifiants SFTP manquants ; snapshot précédent conservé." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$RAKUTEN_DATE_FORMAT" != "MM/DD/YYYY" && "$RAKUTEN_DATE_FORMAT" != "DD/MM/YYYY" ]]; then
            echo "::error::RAKUTEN_DATE_FORMAT doit être MM/DD/YYYY ou DD/MM/YYYY."
            exit 1
          fi
          if [[ -z "${RAKUTEN_SFTP_KNOWN_HOSTS:-}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Import Rakuten bloqué : la clé hôte officielle doit être épinglée dans RAKUTEN_SFTP_KNOWN_HOSTS."
            echo "- Import Rakuten bloqué : clé hôte SFTP officielle non configurée ; snapshot précédent conservé." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$RAKUTEN_SFTP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if ! ssh-keygen -F "aftp.linksynergy.com" -f "$HOME/.ssh/known_hosts" >/dev/null; then
            echo "::error::La clé hôte épinglée ne contient pas aftp.linksynergy.com."
            exit 1
          fi
          curl --version | grep -qi sftp || { echo "::error::curl ne prend pas SFTP en charge."; exit 1; }
          curl --help all | grep -q -- '--knownhosts' || { echo "::error::curl ne permet pas de vérifier la clé hôte SFTP."; exit 1; }
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Télécharger uniquement les flux complets listés sur le serveur
        if: steps.config.outputs.ready == 'true'
        env:
          RAKUTEN_SFTP_USER: ${{ secrets.RAKUTEN_SFTP_USER }}
          RAKUTEN_SFTP_PASSWORD: ${{ secrets.RAKUTEN_SFTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'machine aftp.linksynergy.com login %s password %s\n' "$RAKUTEN_SFTP_USER" "$RAKUTEN_SFTP_PASSWORD" > "$HOME/.netrc-rakuten"
          trap 'rm -f "$HOME/.netrc-rakuten"' EXIT
          CURL=(curl --proto '=sftp' --fail --show-error --silent --ignore-content-length --knownhosts "$HOME/.ssh/known_hosts" --netrc-file "$HOME/.netrc-rakuten" --connect-timeout 15 --max-time 600 --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 600)
          "${CURL[@]}" --list-only "sftp://aftp.linksynergy.com/" > /tmp/rakuten-root-list.txt

          # Rakuten confirme que chaque annonceur dispose d'un dossier nommé par son MID.
          # Le fichier peut aussi être à la racine selon le compte : on détecte les deux cas,
          # sans supposer un chemin ni désactiver la vérification de clé hôte.
          download_feed() {
            local mid="$1" filename="$2" output="$3" required="$4" remote_path="" temporary="${output}.part"
            if grep -Fxq "$filename" /tmp/rakuten-root-list.txt; then
              remote_path="$filename"
            elif grep -Fxq "$mid" /tmp/rakuten-root-list.txt; then
              local listing="/tmp/rakuten-${mid}-list.txt"
              "${CURL[@]}" --list-only "sftp://aftp.linksynergy.com/${mid}/" > "$listing"
              if grep -Fxq "$filename" "$listing"; then
                remote_path="${mid}/${filename}"
              fi
            fi

            if [[ -z "$remote_path" ]]; then
              if [[ "$required" == "true" ]]; then
                echo "::error::Flux requis absent : MID $mid / $filename (racine et dossier MID vérifiés)."
                return 1
              fi
              echo "Flux facultatif absent : MID $mid / $filename."
              return 0
            fi

            echo "Flux trouvé pour MID $mid : $filename."
            rm -f "$temporary"
            if ! "${CURL[@]}" "sftp://aftp.linksynergy.com/${remote_path}" --output "$temporary"; then
              rm -f "$temporary"
              return 1
            fi
            if [[ ! -s "$temporary" ]] || ! gzip -t "$temporary"; then
              rm -f "$temporary"
              echo "::error::Flux gzip incomplet ou invalide : $filename."
              return 1
            fi
            mv "$temporary" "$output"
          }

          download_feed "44806" "44806_4768926_mp.xml.gz" /tmp/44806_4768926_mp.xml.gz true
          download_feed "54306" "54306_4768926_mp.xml.gz" /tmp/54306_4768926_mp.xml.gz false
          download_feed "54306" "54306_4768926_1_cmp.xml.gz" /tmp/54306_4768926_1_cmp.xml.gz false

          gzip -t /tmp/44806_4768926_mp.xml.gz
          if [[ -f /tmp/54306_4768926_1_cmp.xml.gz ]]; then gzip -t /tmp/54306_4768926_1_cmp.xml.gz; fi
          if [[ -f /tmp/54306_4768926_mp.xml.gz ]]; then gzip -t /tmp/54306_4768926_mp.xml.gz; fi
          rm -f "$HOME/.netrc-rakuten"
      - name: Convertir seulement les sources fraîches et complètes
        if: steps.config.outputs.ready == 'true'
        env:
          RAKUTEN_DATE_FORMAT: ${{ vars.RAKUTEN_DATE_FORMAT || 'MM/DD/YYYY' }}
          RAKUTEN_PRICE_TAX_STATUS: ${{ vars.RAKUTEN_PRICE_TAX_STATUS || 'unspecified' }}
          # À passer à true uniquement après confirmation écrite de la TVA par la source marchande.
          RAKUTEN_PRICE_TAX_STATUS_VERIFIED: ${{ vars.RAKUTEN_PRICE_TAX_STATUS_VERIFIED || 'false' }}
        run: |
          python3 scripts/import-rakuten-catalogue.py \
            --directory /tmp \
            --output data/rakuten-products.json \
            --date-format "$RAKUTEN_DATE_FORMAT" \
            --max-age-hours 48 \
            --price-tax-status "${RAKUTEN_PRICE_TAX_STATUS:-unspecified}" \
            --price-tax-status-verified "${RAKUTEN_PRICE_TAX_STATUS_VERIFIED:-false}" \
            --decathlon-limit 1500 \
            --nicchia-limit 1500
      - name: Publier le snapshot validé sans écraser les données précédentes en cas d'échec
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json
          from pathlib import Path
          data=json.loads(Path("data/rakuten-products.json").read_text(encoding="utf-8"))
          assert data.get("status") == "ok" and data.get("products"), "Snapshot vide ou invalide"
          generated=datetime.datetime.fromisoformat(data["generated_at"].replace("Z","+00:00"))
          age=datetime.datetime.now(datetime.timezone.utc)-generated
          assert datetime.timedelta(0) <= age <= datetime.timedelta(hours=48), "Date source hors fenêtre de fraîcheur"
          assert all(p.get("sourceCreatedAt") and (p.get("gtin") or (p.get("brand") and p.get("mpn"))) for p in data["products"]), "Identité exacte absente"
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rakuten-products.json
          if git diff --cached --quiet; then
            echo "Le snapshot n'a pas changé ; aucun commit inutile."
          else
            git commit -m "Refresh fresh authorized Rakuten catalogues"
            git push
          fi
