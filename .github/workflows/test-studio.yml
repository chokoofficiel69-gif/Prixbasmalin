name: Studio IA tests

on:
  push:
    branches: [studio-ia-expert-audio]
  pull_request:
    branches: [studio-ia]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
