name: Analyse de sécurité des secrets

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: read

jobs:
  scan-git-history:
    name: Scanner les secrets dans l'historique Git
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer tout l'historique Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rechercher les clés et secrets connus
        run: node scripts/scan-secrets-history.mjs
