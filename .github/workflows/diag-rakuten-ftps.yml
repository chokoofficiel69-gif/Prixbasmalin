name: Diagnostic FTPS Rakuten (lecture seule)

on:
  workflow_dispatch:
  push:
    branches: [claude/rakuten-import-fix-2026-11-10]
    paths: [".github/workflows/diag-rakuten-ftps.yml"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: DNS (CNAME, SSHFP, DNSSEC) des serveurs Rakuten
        shell: bash
        run: |
          sudo apt-get install -y -qq bind9-dnsutils >/dev/null 2>&1 || true
          for n in aftp.linksynergy.com sftp-rakuten.feedonomics.com; do
            echo "== $n"
            dig +dnssec +noall +answer +comments "$n" A | grep -E 'flags|IN' || true
            echo "-- SSHFP"; dig +dnssec +noall +answer "$n" SSHFP || true
          done
      - name: Clés SSH d'hôtes Rakuten voisins comparées aux empreintes officielles (sans identifiants)
        shell: bash
        run: |
          set +e +o pipefail
          OFF256=6854993e0f41078a1f007d677d298c2a4f7d5f898de149f53e27d3159e4b2bdc
          OFF1=d98a0cdd102177804f99a3534a4a04c6b31ce816
          for h in aftp.linksynergy.com ftp.linksynergy.com sftp.linksynergy.com mftp.linksynergy.com ftp2.linksynergy.com aftp.rakutenadvertising.com sftp.rakutenadvertising.com ftp.rakutenadvertising.com sftp-rakuten.feedonomics.com sftp.feedonomics.com; do
            ip=$(getent hosts "$h" | awk '{print $1; exit}')
            echo "### $h (${ip:-non résolu})"
            [[ -n "$ip" ]] || continue
            ssh-keyscan -T 8 -t rsa,ecdsa,ed25519 "$h" 2>/dev/null | while read -r host type data; do
              [[ -n "${data:-}" ]] || continue
              s256=$(printf '%s' "$data" | base64 -d | sha256sum | cut -d' ' -f1)
              s1=$(printf '%s' "$data" | base64 -d | sha1sum | cut -d' ' -f1)
              ossh=$(printf '%s %s\n' "$type" "$data" | ssh-keygen -E sha256 -lf /dev/stdin 2>/dev/null | awk '{print $2}')
              m=""; [[ "$s256" == "$OFF256" ]] && m=" >>> SHA256 OFFICIELLE"; [[ "$s1" == "$OFF1" ]] && m="$m >>> SHA1 OFFICIELLE"
              echo "  $type $ossh sha256hex=$s256 sha1hex=$s1$m"
            done
          done
