name: Importer les offres Tradedoubler autorisées

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tradedoubler-authorized-import
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check scripts/import-tradedoubler-products.mjs
          node --test tests/import-tradedoubler-products.test.mjs

  import:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier le secret sans afficher sa valeur
        id: config
        env:
          TRADEDOUBLER_PRODUCTS_TOKEN: ${{ secrets.TRADEDOUBLER_PRODUCTS_TOKEN }}
        run: |
          if [[ -z "${TRADEDOUBLER_PRODUCTS_TOKEN:-}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Import non exécuté : secret TRADEDOUBLER_PRODUCTS_TOKEN absent."
            exit 0
          fi
          if [[ ! "$TRADEDOUBLER_PRODUCTS_TOKEN" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Format du jeton Tradedoubler invalide (valeur masquée)."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Télécharger uniquement les flux français EUR modifiés
        if: steps.config.outputs.ready == 'true'
        env:
          TRADEDOUBLER_PRODUCTS_TOKEN: ${{ secrets.TRADEDOUBLER_PRODUCTS_TOKEN }}
          TRADEDOUBLER_MAX_FEEDS: "100"
        run: node scripts/import-tradedoubler-products.mjs
      - name: Publier le snapshot séparé après validation
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s data/tradedoubler-products.json ]]; then
            echo "::notice::Aucun nouveau snapshot Tradedoubler ; publication ignorée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tradedoubler-products.json data/tradedoubler-feed-state.json
          if git diff --cached --quiet; then
            echo "Aucune modification Tradedoubler."
            exit 0
          fi
          git commit -m "Refresh authorized Tradedoubler product feeds"
          git pull --rebase origin main
          git push origin HEAD:main
