name: Prepare manual price relevés (draft PR only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Refuse non-main dispatch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Ce workflow doit être lancé depuis main. Aucun fichier ni branche ne sera créé." >&2
          exit 1
      - name: Checkout main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # data/inbox/releves.csv is a staging input committed to main by the owner.
      # Committing this CSV does not publish prices; this workflow only proposes generated JSON in a draft PR.
      - name: Stop cleanly when CSV has no offer rows
        id: csv
        shell: python
        run: |
          import csv
          import os
          from pathlib import Path
          path = Path("data/inbox/releves.csv")
          with path.open("r", encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              rows = [row for row in reader if any((value or "").strip() for value in row.values())]
          if not rows:
              print("Aucun relevé : CSV sans ligne de données. Fin normale, aucune PR créée.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("has_rows=false\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("has_rows=true\n")
      - name: Snapshot useful data before rebuilding
        if: steps.csv.outputs.has_rows == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          offers = json.loads(Path("data/merchant-offers.json").read_text(encoding="utf-8")).get("offers", [])
          feed = json.loads(Path("data/prices.json").read_text(encoding="utf-8"))
          Path("/tmp/before-useful.json").write_text(json.dumps({
              "offers": offers,
              "products": feed.get("products", []),
              "feed_offers": feed.get("offers", [])
          }, sort_keys=True, ensure_ascii=False), encoding="utf-8")
          PY
      # Always test the code, even when the staging CSV contains only its header.
      # An empty CSV should skip data generation, not skip regression tests.
      - name: Run unit tests
        # Run on main even for an header-only CSV, but only after checkout and CSV inspection succeeded.
        if: always() && steps.csv.outcome == 'success'
        run: python3 -m unittest discover -s tests -v
      - name: Import manual CSV and rebuild feed
        if: steps.csv.outputs.has_rows == 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/import_partner_csv.py data/inbox/releves.csv --output /tmp/imported-offers.json 2>&1 | tee /tmp/import.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          current_path = Path("data/merchant-offers.json")
          imported_path = Path("/tmp/imported-offers.json")
          current = json.loads(current_path.read_text(encoding="utf-8"))
          imported = json.loads(imported_path.read_text(encoding="utf-8"))
          existing_offers = current.get("offers", [])
          imported_offers = imported.get("offers", [])
          if not isinstance(existing_offers, list) or not isinstance(imported_offers, list):
              raise SystemExit("Format invalide : offers doit être une liste.")
          # Keep existing authorized offers; a newly submitted offer_id replaces only itself.
          merged = {offer.get("offer_id"): offer for offer in existing_offers if isinstance(offer, dict) and offer.get("offer_id")}
          for offer in imported_offers:
              merged[offer["offer_id"]] = offer
          current["schema_version"] = 1
          current["generated_at"] = imported.get("generated_at")
          current["offers"] = list(merged.values())
          current_path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Offres conservées : {len(existing_offers)}; importées : {len(imported_offers)}; total fusionné : {len(current['offers'])}.")
          PY
          python3 scripts/build_prices_feed.py 2>&1 | tee /tmp/build.log
          python3 - <<'PY' | tee /tmp/feed-summary.txt
          import json
          from pathlib import Path
          feed = json.loads(Path('data/prices.json').read_text(encoding='utf-8'))
          print(f"Produits retenus : {len(feed.get('products', []))}")
          print(f"Offres retenues : {len(feed.get('offers', []))}")
          errors = feed.get('errors', [])
          print(f"Erreurs/écarts signalés : {len(errors)}")
          for error in errors:
              print(f"- {error}")
          if not feed.get('offers'):
              print('ATTENTION : aucune offre exploitable; aucun prix fictif ne sera ajouté.')
          before = json.loads(Path('/tmp/before-useful.json').read_text(encoding='utf-8'))
          after = {
              "offers": json.loads(Path("data/merchant-offers.json").read_text(encoding="utf-8")).get("offers", []),
              "products": feed.get("products", []),
              "feed_offers": feed.get("offers", [])
          }
          changed = "true" if before != after else "false"
          Path('/tmp/useful-changed.txt').write_text(changed, encoding="utf-8")
          print("Contenu utile modifié : " + ("oui" if before != after else "non"))
          PY
      - name: Add diagnostic summary to job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Résumé préparation des relevés'
            if [ "${{ steps.csv.outputs.has_rows }}" = "false" ]; then
              echo 'CSV sans ligne de données : arrêt normal, aucune PR créée.'
            else
              echo '- Déclenchement autorisé uniquement depuis main.'
              if [ -f /tmp/feed-summary.txt ]; then cat /tmp/feed-summary.txt; fi
              if [ -f /tmp/import.log ]; then echo '### Journal import CSV'; tail -n 40 /tmp/import.log; fi
              if [ -f /tmp/build.log ]; then echo '### Journal construction'; tail -n 40 /tmp/build.log; fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop cleanly if useful offer data did not change
        id: change
        if: steps.csv.outputs.has_rows == 'true' && success()
        shell: bash
        run: |
          if [ "$(cat /tmp/useful-changed.txt)" != "true" ]; then
            echo "Aucune modification utile des offres/produits; les horodatages de génération seuls ne justifient pas une PR."
            echo "Aucune PR ne sera créée."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create dated branch and draft PR (never push main)
        if: steps.csv.outputs.has_rows == 'true' && steps.change.outputs.changed == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/useful-changed.txt)" != "true" ]; then
            echo "Aucune modification utile : arrêt sans PR."
            exit 0
          fi
          BRANCH="data/releves-$(date -u +%F)-run${GITHUB_RUN_NUMBER}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "La branche $BRANCH existe déjà; arrêt sans écraser de branche." >&2
            exit 1
          fi
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/merchant-offers.json data/prices.json
          git commit -m "data: prepare manual price relevés $(date -u +%F)"
          git push origin "$BRANCH"
          gh pr create --draft --base main --head "$BRANCH" \
            --title "Données : relevés manuels $(date -u +%F)" \
            --body "Préparation automatique en brouillon depuis le CSV manuel autorisé. Tests exécutés avant création. Vérifier les identités, dates, prix et frais de livraison. Aucune fusion ni aucun déploiement automatiques."
