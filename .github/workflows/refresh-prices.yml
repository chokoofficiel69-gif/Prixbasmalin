name: Actualiser les prix publics (sources configurées uniquement)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main, feat/phase1-price-quality-ean]

permissions:
  contents: write

concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tester les utilitaires de prix
        run: node --test price-engine/*.test.mjs
      - name: Valider les fiches produit et sources marchandes
        run: node price-engine/validate-config.mjs
      - name: Lire les prix publics et la source eBay autorisée
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_CAMPAIGN_ID: ${{ vars.EBAY_AFFILIATE_CAMPAIGN_ID }}
        run: node price-engine/refresh.mjs
      - name: Enregistrer le relevé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/quality.json
          if git diff --cached --quiet; then
            echo "Aucun changement dans le relevé."
          else
            git commit -m "Refresh verified product prices"
            git push
          fi
