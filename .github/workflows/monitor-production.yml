name: Vérifier le site en production

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - ".github/workflows/monitor-production.yml"
      - "js/track-outbound.js"
      - "js/prix-malin-auth.js"
      - "catalogue.html"
      - "index.html"
      - "partenaires.html"
      - "publicite.html"
      - "high-tech.html"
      - "mode.html"
      - "offres.html"
      - "etat-prix.html"
      - "historique-prix.html"
      - "data/prixtracker-prices.json"
      - "data/prixtracker-best-daily.json"
      - "historique-prix.html"
      - "data/prixtracker-prices.json"
      - "data/prixtracker-best-daily.json"
      - "data/prices.json"
      - "CNAME"
      - "price-engine/**"
      - ".github/workflows/refresh-prices.yml"
      - ".github/workflows/sync-awin-products.yml"
      - "data/awin-products.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/monitor-production.yml"
      - "js/track-outbound.js"
      - "js/prix-malin-auth.js"
      - "catalogue.html"
      - "index.html"
      - "partenaires.html"
      - "publicite.html"
      - "data/featured-prices.json"
      - "etat-prix.html"
      - "data/prices.json"
      - "CNAME"
      - "price-engine/**"
      - ".github/workflows/refresh-prices.yml"
      - ".github/workflows/sync-awin-products.yml"
      - "data/awin-products.json"

permissions:
  contents: read

jobs:
  validate-code:
    name: Tests et syntaxe du code de la branche
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt pour les tests
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tester parseur, URL, identité produit et offres historiques
        run: node --test price-engine/price-utils.test.mjs
      - name: Vérifier la syntaxe du moteur de prix
        run: node --check price-engine/refresh.mjs
      - name: Vérifier la syntaxe du synchroniseur PrixTracker
        run: node --check price-engine/sync-prixtracker.mjs
      - name: Vérifier la syntaxe du synchroniseur Awin
        run: node --check price-engine/sync-awin-products.mjs
      - name: Tester le parseur et l'import direct Awin sans accès réseau
        run: node price-engine/sync-awin-products.mjs --self-test
      - name: Vérifier la syntaxe du Worker attribution
        run: node --check workers/prixbasmalin-attribution.js
      - name: Vérifier la syntaxe du module compte et alertes
        run: node --check js/prix-malin-auth.js

      - name: Vérifier que la mesure d'audience respecte le consentement
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const file of ["partenaires.html", "publicite.html", "high-tech.html", "mode.html", "offres.html"]) {
            const html = fs.readFileSync(file, "utf8");
            if (/beacon\.min\.js/i.test(html)) throw new Error(file + " charge directement le beacon avant le consentement.");
            if (!/cookie-consent\.js/i.test(html)) throw new Error(file + " ne charge pas le gestionnaire de consentement.");
            console.log("OK : mesure d'audience centralisée après consentement — " + file);
          }
          NODE

      - name: Vérifier le blocage des redirections non sûres
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const engine = fs.readFileSync("price-engine/refresh.mjs", "utf8");
          const utils = fs.readFileSync("price-engine/price-utils.mjs", "utf8");
          const tests = fs.readFileSync("price-engine/price-utils.test.mjs", "utf8");
          const checks = [
            ["redirections HTTP désactivées", engine.includes('redirect:"manual"')],
            ["URL cible validée avant chaque requête", engine.includes("if (!isSafeMerchantUrl(currentUrl))")],
            ["redirections validées avec le résolveur sûr", engine.includes("resolveSafeRedirect(location, currentUrl)")],
            ["tests de redirection non sûre présents", tests.includes("résout uniquement les redirections vers des URL HTTPS publiques")],
            ["résolveur de redirection strict disponible", utils.includes("export function resolveSafeRedirect")],
            ["statut historique si toutes les sources échouent", engine.includes('status:hasFreshOffers ? "fresh_offers_available" : "historical_only"')],
          ];
          const failures = checks.filter(([, ok]) => !ok);
          for (const [name, ok] of checks) console.log((ok ? "OK : " : "ÉCHEC : ") + name);
          if (failures.length) process.exit(1);
          NODE
      - name: Vérifier l’attribution consentie et la collecte pays minimale
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const consent = fs.readFileSync("js/cookie-consent.js", "utf8");
          const tracker = fs.readFileSync("js/track-outbound.js", "utf8");
          const worker = fs.readFileSync("workers/prixbasmalin-attribution.js", "utf8");
          const privacy = fs.readFileSync("confidentialite.html", "utf8");
          const migration = fs.readFileSync("migrations/2026-11-06-traffic-attribution-country.sql", "utf8");
          const checks = [
            ["le suivi sortant est chargé après consentement", consent.includes("/js/track-outbound.js")],
            ["le suivi utilise l’attribution de première source", tracker.includes("pm_traffic_attribution")],
            ["les auto-références internes sont exclues", tracker.includes("refHost !== ownHost") && tracker.includes("!refHost.endsWith")],
            ["Google est classé en trafic organique", tracker.includes('"organic"')],
            ["le pays vient du contexte Cloudflare, sans adresse IP", worker.includes("request.cf?.country") && !worker.includes("CF-Connecting-IP")],
            ["le pays est validé comme code ISO alpha-2", worker.includes("/^[A-Z]{2}$/")],
            ["la migration D1 ajoute la colonne pays", migration.includes("ALTER TABLE traffic_attribution ADD COLUMN country TEXT")],
            ["la confidentialité explique la mesure par pays", /pays.*code|code.*pays/i.test(privacy)]
          ];
          const failures = checks.filter(([, ok]) => !ok);
          for (const [name, ok] of checks) console.log((ok ? "OK : " : "ÉCHEC : ") + name);
          if (failures.length) process.exit(1);
          NODE

      - name: Vérifier la syntaxe du validateur de configuration
        run: node --check price-engine/validate-config.mjs
      - name: Valider la configuration des produits et marchands
        run: node price-engine/validate-config.mjs
      - name: Extraire le JavaScript inline de l’accueil
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const html = fs.readFileSync("index.html", "utf8");
          const scriptPattern = new RegExp("<script\\b([^>]*)>([\\s\\S]*?)<\\/script>", "gi");
          const inlineScripts = [...html.matchAll(scriptPattern)]
            .filter(([, attrs, body]) => !/\bsrc\s*=\s*/i.test(attrs) && !/\btype\s*=\s*["\']application\/ld\+json["\']/i.test(attrs) && body.trim())
            .map(([, , body]) => body);
          if (inlineScripts.length === 0) throw new Error("Aucun script inline trouvé dans index.html");
          fs.writeFileSync("/tmp/index-inline.js", inlineScripts.join("\n;\n"));
          console.log("Scripts inline trouvés dans index.html :", inlineScripts.length);
          NODE
      - name: Vérifier la syntaxe JavaScript de l’accueil
        run: node --check /tmp/index-inline.js
      - name: Extraire le JavaScript du catalogue de la branche
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const html = fs.readFileSync("catalogue.html", "utf8");
          const inlineScripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs, body]) => !/\bsrc\s*=/i.test(attrs) && !/\btype\s*=\s*["\']application\/ld\+json["\']/i.test(attrs) && body.trim())
            .map(([, , body]) => body);
          if (inlineScripts.length === 0) throw new Error("Aucun script inline trouvé dans catalogue.html");
          fs.writeFileSync("/tmp/catalogue-inline.js", inlineScripts.join("\n;\n"));
          console.log("Scripts inline trouvés :", inlineScripts.length);
          NODE
      - name: Vérifier la syntaxe JavaScript du catalogue
        run: node --check /tmp/catalogue-inline.js
      - name: Vérifier la séparation catalogue découverte / tarifs vérifiés
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const html = fs.readFileSync("catalogue.html", "utf8");
          const checks = [
            ["section des modèles exacts", html.includes('id="verifiedShelf"')],
            ["rendu dédié aux prix marchands", html.includes("function renderVerifiedProducts(products)")],
            ["liste par marchand", html.includes('list.setAttribute("aria-label","Prix par marchand")')],
            ["catalogue générique sans raccordement direct aux prix exacts", !html.includes("verifiedPriceIndex.get(p.id)")],
            ["liens par marchand stylés", html.includes(".discovery-compare-row") && html.includes(".discovery-disclaimer")],
            ["six destinations de recherche", ["Amazon","Google Shopping","eBay France","Fnac","Cdiscount","Darty"].every(name => html.includes('name:"' + name + '"'))],
          ];
          const failures = checks.filter(([, ok]) => !ok);
          for (const [name, ok] of checks) console.log((ok ? "OK : " : "ÉCHEC : ") + name);
          if (failures.length) process.exit(1);
          NODE

  smoke-test:
    name: Disponibilité de production et Worker attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier la page d'accueil
        run: |
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 25 \
            https://prixbasmalin.fr/ --output /tmp/home.html
          grep -qi "Prix Malin" /tmp/home.html
      - name: Vérifier que le catalogue est publié
        run: |
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 25 \
            https://prixbasmalin.fr/catalogue.html --output /tmp/catalogue.html
          test -s /tmp/catalogue.html
      - name: Vérifier la page d'historique publiée
        run: |
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 25 \
            https://prixbasmalin.fr/historique-prix.html --output /tmp/historique-prix.html
          grep -q "Les prix dans le temps" /tmp/historique-prix.html
      - name: Vérifier les relevés historiques publiés
        run: |
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 25 \
            https://prixbasmalin.fr/data/prixtracker-prices.json --output /tmp/prixtracker-prices.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("/tmp/prixtracker-prices.json", "utf8"));
          if (data.status !== "historical_reference" || !Array.isArray(data.offers) || data.offers.length === 0) {
            throw new Error("Flux historique indisponible ou structure incorrecte.");
          }
          console.log("Historique public valide :", data.counts.rows, "relevés,", data.counts.products, "produits.");
          NODE
      - name: Vérifier le flux des offres à la une
        run: |
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 25 \
            https://prixbasmalin.fr/data/featured-prices.json --output /tmp/featured-prices.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("/tmp/featured-prices.json", "utf8"));
          if (!Array.isArray(data.products)) throw new Error("Le flux featured-prices.json ne contient pas de tableau products.");
          console.log("Flux à la une valide :", data.products.length, "produits.");
          NODE
      - name: Vérifier le code catalogue attendu
        run: grep -q "productData" /tmp/catalogue.html
      - name: Vérifier que le flux de prix est publié
        run: |
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 25 \
            https://prixbasmalin.fr/data/prices.json --output /tmp/prices.json
      - name: Valider la structure du flux de prix
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const raw = fs.readFileSync("/tmp/prices.json", "utf8");
          let data;
          try {
            data = JSON.parse(raw);
          } catch {
            throw new Error("Le serveur n'a pas renvoyé du JSON : " + raw.slice(0, 180).replace(/\s+/g, " "));
          }
          if (!Array.isArray(data.products) || !Array.isArray(data.offers) || !Array.isArray(data.errors)) {
            throw new Error("Structure du flux invalide. Clés reçues : " + Object.keys(data).join(", "));
          }
          if (data.offers.length === 0) {
            console.log("AVERTISSEMENT : aucun prix vérifié publié ; aucune valeur inventée.");
          }
          console.log("Flux JSON valide :", data.products.length, "produits,", data.offers.length, "offres.");
          NODE
      - name: Vérifier le flux Awin public, sa fraîcheur et ses champs marchands
        run: |
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 60 \
            https://prixbasmalin.fr/data/awin-products.json --output /tmp/awin-products.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("/tmp/awin-products.json", "utf8"));
          if (data.status !== "ok" || !Array.isArray(data.products) || data.products.length === 0) {
            throw new Error("Le flux Awin public est vide ou invalide.");
          }
          const fetchedAt = Date.parse(data.fetched_at || "");
          const age = Date.now() - fetchedAt;
          if (!Number.isFinite(fetchedAt) || age < -5 * 60 * 1000 || age > 48 * 60 * 60 * 1000) {
            throw new Error("Le flux Awin public est absent, futur ou trop ancien (>48 h).");
          }
          const valid = data.products.filter(product =>
            product && product.id && product.name &&
            Number.isFinite(Number(product.priceValue)) && Number(product.priceValue) > 0 &&
            /^https:\/\//i.test(String(product.image || "")) &&
            /^https:\/\//i.test(String(product.sourceUrl || "")) &&
            String(product.merchant || "").trim()
          );
          if (valid.length !== data.products.length) {
            throw new Error("Le flux Awin contient " + (data.products.length - valid.length) + " fiche(s) incomplète(s) ou sans source HTTPS.");
          }
          const merchants = new Set(valid.map(product => product.merchant).filter(Boolean));
          const multiMerchant = valid.filter(product =>
            new Set((product.offers || []).map(offer => String(offer.merchant || "").trim().toLowerCase()).filter(Boolean)).size > 1
          ).length;
          const withGtin = valid.filter(product => String(product.gtin || "").trim()).length;
          const withMpn = valid.filter(product => String(product.mpn || "").trim()).length;
          const shippingKnown = valid.filter(product => product.shippingPriceValue !== null && product.shippingPriceValue !== undefined && Number.isFinite(Number(product.shippingPriceValue))).length;
          const availabilityKnown = valid.filter(product => product.availability && product.availability !== "unknown").length;
          const freshness = values => {
            const result = { fresh: 0, missing: 0, stale: 0, invalidOrFuture: 0 };
            for (const value of values) {
              if (value == null || String(value).trim() === "") { result.missing++; continue; }
              const timestamp = Date.parse(value);
              if (!Number.isFinite(timestamp) || timestamp > Date.now() + 5 * 60 * 1000) { result.invalidOrFuture++; continue; }
              if (Date.now() - timestamp <= 48 * 60 * 60 * 1000) result.fresh++;
              else result.stale++;
            }
            return result;
          };
          const productDates = freshness(valid.map(product => product.merchantUpdatedAt));
          const offerDates = freshness(valid.flatMap(product => Array.isArray(product.offers) && product.offers.length
            ? product.offers.map(offer => offer.merchantUpdatedAt)
            : [product.merchantUpdatedAt]));
          console.log("Flux Awin public valide :", valid.length, "offres /", merchants.size, "marchands.");
          console.log("Identifiants partagés : GTIN", withGtin, "MPN", withMpn, "comparaisons multi-marchands exactes", multiMerchant + ".");
          console.log("Livraison connue :", shippingKnown, "offres ; disponibilité connue :", availabilityKnown + ".");
          console.log("Fraîcheur merchantUpdatedAt — fiches :", JSON.stringify(productDates), "; offres :", JSON.stringify(offerDates), "(fraîches = moins de 48 h).");
          console.log("Import du flux :", new Date(fetchedAt).toISOString(), "— âge", Math.round(age / 3600000), "h.");
          const summary = [
            "### Diagnostic Awin — fraîcheur des prix",
            "",
            "- Flux reçu : " + valid.length + " fiches/offres ; " + merchants.size + " marchands.",
            "- merchantUpdatedAt sur les fiches : " + productDates.fresh + " fraîches, " + productDates.missing + " sans date, " + productDates.stale + " périmées, " + productDates.invalidOrFuture + " invalides/futures.",
            "- merchantUpdatedAt sur les offres imbriquées : " + offerDates.fresh + " fraîches, " + offerDates.missing + " sans date, " + offerDates.stale + " périmées, " + offerDates.invalidOrFuture + " invalides/futures.",
            "- Correspondances multi-marchands exactes : " + multiMerchant + " ; GTIN : " + withGtin + " ; MPN : " + withMpn + ".",
            "- Livraison connue : " + shippingKnown + " ; disponibilité connue : " + availabilityKnown + ".",
            "- fetched_at : " + new Date(fetchedAt).toISOString() + " (âge " + Math.round(age / 3600000) + " h)."
          ].join("\n");
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
          if (multiMerchant === 0) {
            console.log("AVERTISSEMENT : offres individuelles réelles, mais aucune comparaison multi-marchands exacte sans GTIN/MPN commun.");
          }
          NODE
      - name: Vérifier le Worker d'attribution
        run: |
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 25 \
            https://prixbasmalin-attribution.chokoofficiel69.workers.dev/health --output /tmp/worker-health.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("/tmp/worker-health.json", "utf8"));
          if (data.ok !== true || data.service !== "prixbasmalin-attribution") {
            throw new Error("Le Worker attribution n'a pas renvoyé le statut attendu");
          }
          console.log("Worker attribution joignable et sain.");
          NODE
