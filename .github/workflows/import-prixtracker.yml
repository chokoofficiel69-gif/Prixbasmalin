name: Actualiser les historiques PrixTracker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "price-engine/import-prixtracker*.mjs"
      - "price-engine/sync-prixtracker.mjs"
      - "scripts/build_product_sheets.py"
      - ".github/workflows/import-prixtracker.yml"
  pull_request:
    paths:
      - "price-engine/import-prixtracker*.mjs"
      - "price-engine/sync-prixtracker.mjs"
      - ".github/workflows/import-prixtracker.yml"
  schedule:
    - cron: "35 5 * * *"
permissions:
  contents: write
concurrency:
  group: prixtracker-history
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger les exports publics PrixTracker via data.gouv.fr
        run: node price-engine/sync-prixtracker.mjs
      - name: Valider les relevés importés
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for (const f of ['data/prixtracker-prices.json','data/prixtracker-best-daily.json']) { const d=JSON.parse(fs.readFileSync(f,'utf8')); if (!d.counts?.rows || !d.products?.length) throw new Error('Dataset vide: '+f); if (d.status !== 'historical_reference') throw new Error('Statut historique manquant: '+f); console.log(f, d.counts); }"
      - name: Construire les fiches produits comparatives
        run: python3 scripts/build_product_sheets.py
      - name: Publier uniquement si les fichiers ont changé
        if: github.event_name != 'pull_request'
        run: |
          git add data/prixtracker-prices.json data/prixtracker-best-daily.json data/fiches-produits.json
          if git diff --cached --quiet; then
            echo "Aucune évolution des données."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: actualiser les historiques PrixTracker"
          git push
