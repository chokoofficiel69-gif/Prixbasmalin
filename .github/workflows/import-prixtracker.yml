name: Actualiser les historiques PrixTracker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "price-engine/import-prixtracker*.mjs"
      - "price-engine/sync-prixtracker.mjs"
      - "scripts/build_product_sheets.py"
      - "scripts/build_home_deals.py"
      - "scripts/build_seo_pages.py"
      - "scripts/build_home_showcase.py"
      - "tests/test_home_deals.py"
      - "tests/test_seo_pages.py"
      - ".github/workflows/import-prixtracker.yml"
  pull_request:
    paths:
      - "price-engine/import-prixtracker*.mjs"
      - "price-engine/sync-prixtracker.mjs"
      - "scripts/build_home_deals.py"
      - "scripts/build_seo_pages.py"
      - "scripts/build_home_showcase.py"
      - "tests/test_home_deals.py"
      - "tests/test_seo_pages.py"
      - ".github/workflows/import-prixtracker.yml"
  schedule:
    - cron: "35 5 * * *"
permissions:
  contents: write
concurrency:
  # Partagé avec Awin : les deux workflows reconstruisent data/home-deals.json.
  group: ${{ github.event_name == 'pull_request' && format('prix-malin-pr-{0}-{1}', github.event.pull_request.number, github.workflow) || 'prix-malin-price-data-refresh' }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger les exports publics PrixTracker via data.gouv.fr
        run: node price-engine/sync-prixtracker.mjs
      - name: Valider les relevés importés
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for (const f of ['data/prixtracker-prices.json','data/prixtracker-best-daily.json']) { const d=JSON.parse(fs.readFileSync(f,'utf8')); if (!d.counts?.rows || !d.products?.length) throw new Error('Dataset vide: '+f); if (d.status !== 'historical_reference') throw new Error('Statut historique manquant: '+f); console.log(f, d.counts); }"
      - name: Construire les fiches produits comparatives
        run: |
          python3 scripts/build_product_sheets.py
          python3 scripts/build_home_deals.py
          python3 scripts/build_seo_pages.py
          python3 scripts/build_home_showcase.py
          python3 scripts/build_partners_page.py
          python3 scripts/build_sitemap.py
      - name: Tester la vitrine et les pages SEO avec prix vérifiés
        run: |
          python3 -m unittest discover -s tests -p 'test_home_deals.py' -v
          python3 -m unittest discover -s tests -p 'test_seo_pages.py' -v
          python3 -m unittest discover -s tests -p 'test_home_showcase.py' -v
      - name: Publier uniquement si les fichiers ont changé
        if: github.event_name != 'pull_request'
        run: |
          git add data/prixtracker-prices.json data/prixtracker-best-daily.json data/fiches-produits.json data/home-deals.json prix idees-cadeaux black-friday.html boutiques-partenaires.html index.html sitemap.xml sitemap.txt data/sitemap-lastmod.json
          if git diff --cached --quiet; then
            echo "Aucune évolution des données."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: actualiser les historiques PrixTracker"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::La branche a changé sur les mêmes données pendant l'import PrixTracker ; aucune donnée précédente n'est écrasée."
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "La branche a avancé pendant la publication PrixTracker (tentative ${attempt}/3)."
          done
          echo "::error::Impossible de publier le snapshot PrixTracker après trois tentatives."
          exit 1
