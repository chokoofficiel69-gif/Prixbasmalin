name: Synchroniser le catalogue produits Awin autorisé

on:
  workflow_dispatch:
  schedule:
    - cron: "27 4 * * *"
  push:
    branches: [main, awin-direct-feed-fix-2026-11-04, fix/awin-gtin-mpn-aliases, fix/awin-feed-import-freshness-2026-11-13]
    paths:
      - "price-engine/sync-awin-products.mjs"
      - "scripts/build_home_deals.py"
      - "scripts/check_awin_gift_images.py"
      - "scripts/build_seo_pages.py"
      - "tests/test_home_deals.py"
      - "tests/test_awin_gift_images.py"
      - "index.html"
      - "tests/test_seo_pages.py"
      - ".github/workflows/sync-awin-products.yml"

permissions:
  contents: write

concurrency:
  # Awin et PrixTracker publient tous deux data/home-deals.json.
  group: ${{ github.event_name == 'pull_request' && format('prix-malin-pr-{0}-{1}', github.event.pull_request.number, github.workflow) || 'prix-malin-price-data-refresh' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe et les tests hors ligne Awin
        run: |
          node --check price-engine/sync-awin-products.mjs
          node price-engine/sync-awin-products.mjs --self-test
      - name: Vérifier la présence d'un accès Awin sans afficher sa valeur
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PRODUCT_DATA_FEED_URL: ${{ secrets.AWIN_PRODUCT_DATA_FEED_URL }}
          AWIN_PRODUCT_DATA_API_KEY: ${{ secrets.AWIN_PRODUCT_DATA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AWIN_PRODUCT_DATA_FEED_URL:-}" && -z "${AWIN_API_TOKEN:-}" && -z "${AWIN_PRODUCT_DATA_API_KEY:-}" ]]; then
            echo "::error::Aucun accès Awin configuré : flux direct, jeton éditeur et clé de flux standard absents."
            exit 1
          fi
          if [[ -n "${AWIN_PRODUCT_DATA_FEED_URL:-}" ]]; then
            echo "Flux direct Awin configuré (URL masquée)."
          fi
          if [[ -n "${AWIN_API_TOKEN:-}" ]]; then
            echo "Jeton Publisher API Awin configuré ; contrôle joined/pending activé (valeur masquée)."
          else
            echo "Jeton Publisher API Awin absent ; relations joined/pending non vérifiables."
          fi
          if [[ -n "${AWIN_PRODUCT_DATA_API_KEY:-}" ]]; then
            echo "Clé de flux standard Awin configurée (valeur masquée)."
          elif node -e 'const raw=process.env.AWIN_PRODUCT_DATA_FEED_URL||"";try{const u=new URL(raw),p=u.pathname.split("/").filter(Boolean),i=p.findIndex(x=>x.toLowerCase()==="apikey"),j=p.findIndex(x=>x.toLowerCase()==="publisher"),pid=String(process.env.AWIN_PUBLISHER_ID||"3137386"),host=u.hostname.toLowerCase(),ok=u.protocol==="https:"&&((host==="productdata.awin.com"&&i>=0&&!!p[i+1])||(host==="ui.awin.com"&&j>=0&&p[j+1]===pid&&!!p[j+2]&&p[j+3]==="1"&&p[j+4]==="feedList"));process.exit(ok?0:1)}catch{process.exit(1)}'
          then
            echo "Clé de flux standard Awin détectée via l'URL directe (valeur masquée)."
          else
            echo "Clé de flux standard Awin absente."
          fi
      - name: Télécharger les flux produits autorisés
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PRODUCT_DATA_FEED_URL: ${{ secrets.AWIN_PRODUCT_DATA_FEED_URL }}
          AWIN_PRODUCT_DATA_API_KEY: ${{ secrets.AWIN_PRODUCT_DATA_API_KEY }}
          AWIN_PUBLISHER_ID: "3137386"
          AWIN_FEED_LOCALE: "fr_FR"
        run: node price-engine/sync-awin-products.mjs
      - name: Mettre à jour la vitrine d'accueil (idées cadeaux)
        run: |
          python3 scripts/build_home_deals.py
          python3 scripts/check_awin_gift_images.py
          python3 scripts/build_seo_pages.py
          python3 scripts/build_sitemap.py
      - name: Tester les pages cadeaux et historiques publiées
        run: |
          python3 -m unittest discover -s tests -p 'test_home_deals.py' -v
          python3 -m unittest discover -s tests -p 'test_awin_gift_images.py' -v
          python3 -m unittest discover -s tests -p 'test_seo_pages.py' -v
      - name: Enregistrer le catalogue s'il a changé
        id: save
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/awin-products.json data/awin-sync-status.json data/home-deals.json idees-cadeaux prix sitemap.xml sitemap.txt data/sitemap-lastmod.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucune nouvelle donnée catalogue ; aucun commit inutile."
            exit 0
          fi
          EXPECTED_FETCHED_AT="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('data/awin-products.json','utf8')).fetched_at||'')")"
          if [[ -z "$EXPECTED_FETCHED_AT" ]]; then
            echo "::error::La date d'import Awin manque dans le catalogue généré."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "expected_fetched_at=$EXPECTED_FETCHED_AT" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/awin-products.json data/awin-sync-status.json data/home-deals.json idees-cadeaux prix sitemap.xml sitemap.txt data/sitemap-lastmod.json
          git commit -m "Refresh authorized Awin product catalogue"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::La branche a changé sur les mêmes données pendant la synchronisation Awin ; aucune donnée précédente n'est écrasée."
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "La branche a avancé pendant la publication Awin (tentative ${attempt}/3)."
          done
          echo "::error::Impossible de publier le snapshot Awin après trois tentatives."
          exit 1
      - name: Vérifier que le nouveau flux Awin est visible sur le site public
        if: steps.save.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          EXPECTED_FETCHED_AT: ${{ steps.save.outputs.expected_fetched_at }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location --connect-timeout 3 --max-time 5 \
              -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
              "https://prixbasmalin.fr/data/awin-products.json?v=${EXPECTED_FETCHED_AT}" --output /tmp/awin-public.json; then
              ACTUAL_FETCHED_AT="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('/tmp/awin-public.json','utf8')).fetched_at||'')")"
              if [[ "$ACTUAL_FETCHED_AT" == "$EXPECTED_FETCHED_AT" ]]; then
                node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("/tmp/awin-public.json", "utf8"));
          const age = Date.now() - Date.parse(data.fetched_at || "");
          if (data.status !== "ok" || !Array.isArray(data.products) || !data.products.length) {
            throw new Error("Le flux Awin publié est vide ou invalide.");
          }
          if (!Number.isFinite(age) || age < -5 * 60 * 1000 || age > 48 * 60 * 60 * 1000) {
            throw new Error("Le flux Awin publié est trop ancien ou mal daté.");
          }
          const valid = data.products.filter(product =>
            product && product.id && product.name &&
            Number.isFinite(Number(product.priceValue)) && Number(product.priceValue) > 0 &&
            /^https:\/\//i.test(String(product.image || "")) &&
            /^https:\/\//i.test(String(product.sourceUrl || "")) &&
            String(product.merchant || "").trim()
          );
          if (valid.length !== data.products.length) {
            throw new Error("Le flux Awin publié contient des fiches incomplètes.");
          }
          const merchants = new Set(valid.map(product => product.merchant).filter(Boolean));
          const allOffers = valid.flatMap(product => Array.isArray(product.offers) && product.offers.length ? product.offers : [product]);
          const taxIncluded = allOffers.filter(offer => offer.priceTaxStatus === "included" || offer.price_tax_status === "included").length;
          const multiMerchant = valid.filter(product =>
            new Set((product.offers || []).map(offer => String(offer.merchant || "").trim().toLowerCase()).filter(Boolean)).size > 1
          ).length;
          const categories = Object.fromEntries(valid.reduce((map, product) => {
            const key = product.category || "other";
            map.set(key, (map.get(key) || 0) + 1);
            return map;
          }, new Map()));
          console.log("Publication Awin vérifiée :", valid.length, "offres /", merchants.size, "marchands.");
          console.log("Comparaisons multi-marchands exactes :", multiMerchant, "— prix TTC explicitement confirmés :", taxIncluded, "— catégories :", JSON.stringify(categories));
          console.log("Flux public à jour :", data.fetched_at);
          if (multiMerchant === 0) {
            console.log("AVERTISSEMENT : les offres restent individuelles faute de GTIN/MPN commun.");
          }
          NODE
                curl --fail --silent --show-error --location --connect-timeout 3 --max-time 10 \
                  -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
                  "https://prixbasmalin.fr/data/awin-sync-status.json?v=${EXPECTED_FETCHED_AT}" --output /tmp/awin-sync-status-public.json
                node --input-type=module <<'NODE'
          import fs from "node:fs";
          const status = JSON.parse(fs.readFileSync("/tmp/awin-sync-status-public.json", "utf8"));
          if (status.schema_version !== 1 || status.status !== "ok" ||
              status.fetched_at !== process.env.EXPECTED_FETCHED_AT ||
              !["verified","partial","not_verified"].includes(status.programmes_check_status) ||
              !Object.prototype.hasOwnProperty.call(status, "joined_advertisers_checked") ||
              !Object.prototype.hasOwnProperty.call(status, "pending_advertisers_detected")) {
            throw new Error("Le statut Awin public est absent, incomplet ou mal daté.");
          }
          console.log("Statut Awin public vérifié : joined=" + status.joined_advertisers_checked +
            " ; pending=" + status.pending_advertisers_detected +
            " ; offres programmes/standards supplémentaires=" + status.additional_authorized_offers_imported +
            " ; contrôle=" + status.programmes_check_status);
          NODE
                curl --fail --silent --show-error --location --connect-timeout 3 --max-time 10 \
                  -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
                  "https://prixbasmalin.fr/catalogue.html?v=${EXPECTED_FETCHED_AT}" --output /tmp/catalogue-public.html
                if grep -Fq 'id="pmAwinFeedStatus"' /tmp/catalogue-public.html; then
                  echo "::error::Un diagnostic technique Awin ne doit pas être exposé aux visiteurs."
                  exit 1
                fi
                grep -Fq 'id="verifiedShelf" class="verified-shelf" aria-live="polite" hidden' /tmp/catalogue-public.html
                grep -Fq 'verifiedShelf.hidden=true;' /tmp/catalogue-public.html
                grep -Fq 'offer.currency!=="EUR"||offer.price_tax_status!=="included"' /tmp/catalogue-public.html
                grep -Fq 'age<=maxAgeHours*60*60*1000' /tmp/catalogue-public.html
                echo "Interface publique vérifiée : comparaisons masquées sans offre exacte, fraîche et TTC ; aucun diagnostic technique exposé."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Le site public n'a pas servi la nouvelle version du flux Awin après 10 minutes."
          exit 1
      - name: Vérifier la vitrine cadeaux et les images marchandes publiques
        if: ${{ steps.save.outputs.changed == 'true' && github.ref == 'refs/heads/main' }}
        env:
          EXPECTED_FETCHED_AT: ${{ steps.save.outputs.expected_fetched_at }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --connect-timeout 3 --max-time 10 \
            -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
            "https://prixbasmalin.fr/data/home-deals.json?v=${EXPECTED_FETCHED_AT}" --output /tmp/home-deals-public.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("/tmp/home-deals-public.json", "utf8"));
          if (data.awin_fetched_at !== process.env.EXPECTED_FETCHED_AT || !Array.isArray(data.gifts)) {
            throw new Error("La vitrine cadeaux publique ne correspond pas au dernier import Awin.");
          }
          const gifts = data.gifts;
          const invalidImages = gifts.filter(g => g.image_verified === true &&
            (!/^https:\/\//i.test(String(g.image || "")) || g.image_provenance !== "Flux marchand Awin autorisé" ||
             !g.image_verified_at));
          const falsePrices = gifts.filter(g => g.price_verified !== true &&
            (g.price_eur !== null || g.shipping_eur !== null));
          const invalidPrices = gifts.filter(g => g.price_verified === true &&
            (!Number.isFinite(Number(g.price_eur)) || g.price_tax_status !== "included" ||
             g.price_date_kind !== "merchant" || !g.price_date));
          if (invalidImages.length || falsePrices.length || invalidPrices.length) {
            throw new Error("La vitrine cadeaux contient une image non sourcée ou un prix non vérifié.");
          }
          const uniqueVerified = new Set(gifts.filter(g => g.image_verified === true).map(g => g.image)).size;
          const unpriced = gifts.filter(g => g.image_verified === true && g.price_verified !== true).length;
          console.log("Vitrine cadeaux publique :", uniqueVerified, "images marchandes uniques vérifiées ;",
            unpriced, "cartes sans prix affiché ;", gifts.filter(g => g.price_verified === true).length,
            "prix TTC marchands vérifiés.");
          if (uniqueVerified === 0) {
            console.log("AVERTISSEMENT : aucune image marchande n'est vérifiée ; la vitrine conserve son message de secours.");
          }
          NODE
          curl --fail --silent --show-error --location --connect-timeout 3 --max-time 10 \
            -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
            "https://prixbasmalin.fr/?v=${EXPECTED_FETCHED_AT}" --output /tmp/home-public.html
          grep -Fq 'g.image_verified!==true' /tmp/home-public.html
          grep -Fq 'Prix non vérifié' /tmp/home-public.html
          grep -Fq 'giftRail.querySelectorAll("img")' /tmp/home-public.html
          echo "Accueil public : cartes sans prix affiché tant que le TTC n'est pas confirmé ; images non vérifiées masquées."
