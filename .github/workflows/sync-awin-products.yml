name: Synchroniser le catalogue produits Awin autorisé

on:
  workflow_dispatch:
  schedule:
    - cron: "27 4 * * *"
  push:
    branches: [main, awin-direct-feed-fix-2026-11-04, fix/awin-gtin-mpn-aliases]
    paths:
      - "price-engine/sync-awin-products.mjs"
      - ".github/workflows/sync-awin-products.yml"

permissions:
  contents: write

concurrency:
  group: awin-product-catalogue
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe et les tests hors ligne Awin
        run: |
          node --check price-engine/sync-awin-products.mjs
          node price-engine/sync-awin-products.mjs --self-test
      - name: Vérifier la présence d'un accès Awin sans afficher sa valeur
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PRODUCT_DATA_FEED_URL: ${{ secrets.AWIN_PRODUCT_DATA_FEED_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${AWIN_PRODUCT_DATA_FEED_URL:-}" ]]; then
            echo "Flux direct Awin configuré (URL masquée)."
          elif [[ -n "${AWIN_API_TOKEN:-}" ]]; then
            echo "Jeton éditeur Awin configuré (valeur masquée)."
          else
            echo "::error::Aucun accès Awin configuré : ni flux direct ni jeton éditeur."
            exit 1
          fi
      - name: Télécharger les flux produits autorisés
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PRODUCT_DATA_FEED_URL: ${{ secrets.AWIN_PRODUCT_DATA_FEED_URL }}
          AWIN_PRODUCT_DATA_API_KEY: ${{ secrets.AWIN_PRODUCT_DATA_API_KEY }}
          AWIN_PUBLISHER_ID: "3137386"
          AWIN_FEED_LOCALE: "fr_FR"
        run: node price-engine/sync-awin-products.mjs
      - name: Enregistrer le catalogue s'il a changé
        id: save
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/awin-products.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucune nouvelle donnée catalogue ; aucun commit inutile."
            exit 0
          fi
          EXPECTED_FETCHED_AT="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('data/awin-products.json','utf8')).fetched_at||'')")"
          if [[ -z "$EXPECTED_FETCHED_AT" ]]; then
            echo "::error::La date d'import Awin manque dans le catalogue généré."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "expected_fetched_at=$EXPECTED_FETCHED_AT" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/awin-products.json
          git commit -m "Refresh authorized Awin product catalogue"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Vérifier que le nouveau flux Awin est visible sur le site public
        if: steps.save.outputs.changed == 'true'
        env:
          EXPECTED_FETCHED_AT: ${{ steps.save.outputs.expected_fetched_at }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location --connect-timeout 3 --max-time 5 \
              -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
              "https://prixbasmalin.fr/data/awin-products.json?v=${EXPECTED_FETCHED_AT}" --output /tmp/awin-public.json; then
              ACTUAL_FETCHED_AT="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('/tmp/awin-public.json','utf8')).fetched_at||'')")"
              if [[ "$ACTUAL_FETCHED_AT" == "$EXPECTED_FETCHED_AT" ]]; then
                node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("/tmp/awin-public.json", "utf8"));
          const age = Date.now() - Date.parse(data.fetched_at || "");
          if (data.status !== "ok" || !Array.isArray(data.products) || !data.products.length) {
            throw new Error("Le flux Awin publié est vide ou invalide.");
          }
          if (!Number.isFinite(age) || age < -5 * 60 * 1000 || age > 48 * 60 * 60 * 1000) {
            throw new Error("Le flux Awin publié est trop ancien ou mal daté.");
          }
          const valid = data.products.filter(product =>
            product && product.id && product.name &&
            Number.isFinite(Number(product.priceValue)) && Number(product.priceValue) > 0 &&
            /^https:\/\//i.test(String(product.image || "")) &&
            /^https:\/\//i.test(String(product.sourceUrl || "")) &&
            String(product.merchant || "").trim()
          );
          if (valid.length !== data.products.length) {
            throw new Error("Le flux Awin publié contient des fiches incomplètes.");
          }
          const merchants = new Set(valid.map(product => product.merchant).filter(Boolean));
          const multiMerchant = valid.filter(product =>
            new Set((product.offers || []).map(offer => String(offer.merchant || "").trim().toLowerCase()).filter(Boolean)).size > 1
          ).length;
          const categories = Object.fromEntries(valid.reduce((map, product) => {
            const key = product.category || "other";
            map.set(key, (map.get(key) || 0) + 1);
            return map;
          }, new Map()));
          console.log("Publication Awin vérifiée :", valid.length, "offres /", merchants.size, "marchands.");
          console.log("Comparaisons multi-marchands exactes :", multiMerchant, "— catégories :", JSON.stringify(categories));
          console.log("Flux public à jour :", data.fetched_at);
          if (multiMerchant === 0) {
            console.log("AVERTISSEMENT : les offres restent individuelles faute de GTIN/MPN commun.");
          }
          NODE
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Le site public n'a pas servi la nouvelle version du flux Awin après 10 minutes."
          exit 1
