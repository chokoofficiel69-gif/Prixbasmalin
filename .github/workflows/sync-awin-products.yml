name: Synchroniser le catalogue produits Awin autorisé

on:
  workflow_dispatch:
  schedule:
    - cron: "27 4 * * *"
  push:
    branches: [main, awin-direct-feed-fix-2026-11-04]
    paths:
      - "price-engine/sync-awin-products.mjs"
      - ".github/workflows/sync-awin-products.yml"

permissions:
  contents: write

concurrency:
  group: awin-product-catalogue
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe et les tests hors ligne Awin
        run: |
          node --check price-engine/sync-awin-products.mjs
          node price-engine/sync-awin-products.mjs --self-test
      - name: Vérifier la présence d'un accès Awin sans afficher sa valeur
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PRODUCT_DATA_FEED_URL: ${{ secrets.AWIN_PRODUCT_DATA_FEED_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${AWIN_PRODUCT_DATA_FEED_URL:-}" ]]; then
            echo "Flux direct Awin configuré (URL masquée)."
          elif [[ -n "${AWIN_API_TOKEN:-}" ]]; then
            echo "Jeton éditeur Awin configuré (valeur masquée)."
          else
            echo "::error::Aucun accès Awin configuré : ni flux direct ni jeton éditeur."
            exit 1
          fi
      - name: Télécharger les flux produits autorisés
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PRODUCT_DATA_FEED_URL: ${{ secrets.AWIN_PRODUCT_DATA_FEED_URL }}
          AWIN_PRODUCT_DATA_API_KEY: ${{ secrets.AWIN_PRODUCT_DATA_API_KEY }}
          AWIN_PUBLISHER_ID: "3137386"
          AWIN_FEED_LOCALE: "fr_FR"
        run: node price-engine/sync-awin-products.mjs
      - name: Enregistrer le catalogue s'il a changé
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/awin-products.json; then
            echo "Aucune nouvelle donnée catalogue ; aucun commit inutile."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/awin-products.json
          git commit -m "Refresh authorized Awin product catalogue"
          git push origin "HEAD:${GITHUB_REF_NAME}"
