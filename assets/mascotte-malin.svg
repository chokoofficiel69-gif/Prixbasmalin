<circle cx="120" cy="184" r="13" fill="#fff" opacity=".98"/>
<path d="M114 181v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#ff5a1f" stroke-width="3" stroke-linecap="round"/>
<rect x="111" y="180" width="18" height="13" rx="3" fill="#ff5a1f"/>
<path d="m115 186 3 3 6-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>