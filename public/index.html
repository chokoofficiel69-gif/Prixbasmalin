<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Studio IA">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>Studio IA</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form class="login-card" id="login-form">
      <div class="logo-big">✦</div>
      <h1>Studio IA</h1>
      <p class="muted">Votre espace IA : discussions, agents, images, clips, musique et voix.</p>
      <input type="text" id="login-user" placeholder="Identifiant" autocomplete="username" autocapitalize="none" spellcheck="false">
      <input type="password" id="login-pass" placeholder="Mot de passe" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Entrer</button>
      <p id="login-err" class="err"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">✦</span> Studio IA</div>
      <div class="project-switch">
        <label for="project-select" class="tiny muted">Projet actif</label>
        <select id="project-select"></select>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div class="tiny muted" id="me-label" style="width:100%"></div>
        <button class="btn ghost small" id="theme-btn" title="Thème clair / sombre">◐ Thème</button>
        <button class="btn ghost small" id="logout-btn">Déconnexion</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" aria-label="Menu">☰</button>
        <h2 id="view-title">Accueil</h2>
        <span class="project-pill" id="project-pill"></span>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div id="toasts" class="toasts"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
