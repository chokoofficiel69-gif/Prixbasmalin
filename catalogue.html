let verifiedPriceIndex = new Map();
const MAX_PRICE_AGE_MS = 48 * 60 * 60 * 1000;
function isVerifiedPriceProduct(product) {
  if (!product || typeof product.id !== "string" || !product.id.trim()) return false;
  if (typeof product.best_price_eur !== "number" || !Number.isFinite(product.best_price_eur) || product.best_price_eur < 0) return false;
  if (!Array.isArray(product.offers) || product.offers.length === 0) return false;
  const validOffers = product.offers.filter(offer => {
    if (!offer || typeof offer.product_url !== "string" || typeof offer.checked_at !== "string") return false;
    let url, checkedAt;
    try { url = new URL(offer.product_url); checkedAt = Date.parse(offer.checked_at); } catch (_) { return false; }
    const age = Date.now() - checkedAt;
    return url.protocol === "https:" && Number.isFinite(checkedAt) && age >= 0 && age <= MAX_PRICE_AGE_MS;
  });
  if (!validOffers.length) return false;
  product.offers = validOffers;
  product.offer_count = validOffers.length;
  return true;
}

function render(){const q=searchEl.value.trim().toLocaleLowerCase("fr");const found=productData.filter(p=>(category==="all"||p.category===category)&&(!q||(p.name+" "+p.desc+" "+p.query).toLocaleLowerCase("fr").includes(q)));productsEl.innerHTML="";countEl.textContent=found.length+" produit(s)";if(!found.length){productsEl.innerHTML='<div class="empty">Aucun produit trouvé. Essayez un autre mot.</div>';return;}found.forEach(p=>{const card=document.createElement("article");card.className="product";const photo=document.createElement("div");photo.className="photo";const img=document.createElement("img");img.src=p.image;img.alt=p.name;img.loading="lazy";img.onerror=()=>{photo.innerHTML='<span>Image indisponible</span>'};photo.append(img);const name=document.createElement("div");name.className="name";name.textContent=p.name;const desc=document.createElement("div");desc.className="desc";desc.textContent=p.desc;const price=document.createElement("div");price.className="price";const live=verifiedPriceIndex.get(p.id);price.textContent=live?new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(live.best_price_eur):"Prix réel en cours de collecte";const merchant=document.createElement("div");merchant.className="merchant";merchant.textContent=live?live.offer_count+" offre(s) vérifiée(s) • relevé "+new Date(live.offers[0].checked_at).toLocaleString("fr-FR"):"Pas encore de prix vérifié pour cette fiche";const offer=document.createElement("a");offer.className="offer";offer.textContent=live?"Comparer "+live.offer_count+" offre(s) ↗":"Rechercher chez Amazon ↗";offer.href=live&&live.offers[0]?.product_url?live.offers[0].product_url:"https://www.amazon.fr/s?k="+encodeURIComponent(p.query)+"&tag=prixbasmalin2-21";offer.target="_blank";offer.rel="noopener noreferrer";card.append(photo,name,desc,price,merchant,offer);productsEl.append(card);});}
