<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Prix Malin — Comparez. Économisez. Malin.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff5a1f;--ink:#191919;--muted:#777;--line:#ededed;--soft:#f6f6f6;--green:#239b50}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,sans-serif;padding-bottom:92px}
button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}button{cursor:pointer}
header{height:64px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--orange);display:grid;place-items:center;color:#fff;flex:none;font-weight:800;font-size:14px}
.brand-name{font-family:Outfit,Inter,sans-serif;font-weight:800;font-size:18px;letter-spacing:-.5px;line-height:1.1;white-space:nowrap}
.brand-name span{color:var(--orange)}
.tagline{font-size:10px;color:#999;margin-top:1px}
.icon-button{border:0;background:transparent;width:36px;height:36px;border-radius:50%;font-size:18px;display:grid;place-items:center}
main{max-width:860px;margin:0 auto}
.search-row{padding:8px 14px 6px;display:flex;gap:8px}
.search{height:42px;display:flex;flex:1;min-width:0;background:#f5f5f5;border-radius:12px;overflow:hidden}
.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;padding:0 12px;font-size:14px;color:var(--ink)}
.search input::placeholder{color:#aaa}
.search button{width:46px;border:0;background:var(--orange);color:#fff;font-size:18px}
.filter-button{width:42px;border:0;border-radius:12px;background:#f5f5f5;font-size:16px;color:#222}
.categories{display:flex;gap:10px;overflow-x:auto;padding:8px 14px 14px;scrollbar-width:none}
.categories::-webkit-scrollbar,.products::-webkit-scrollbar{display:none}
.category{border:0;background:transparent;min-width:58px;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#666;font-size:11px;font-weight:600}
.category-icon{height:44px;width:44px;border:1.5px solid #eee;border-radius:50%;display:grid;place-items:center;font-size:18px;background:#fff}
.category.active .category-icon{background:var(--orange);border-color:var(--orange);color:#fff}
.banner{margin:2px 14px 16px;background:var(--orange);border-radius:16px;padding:16px;display:flex;align-items:center;gap:10px;color:#fff}
.banner-copy{min-width:0;flex:1}
.banner h1{font-family:Outfit,Inter,sans-serif;font-size:18px;line-height:1.15;letter-spacing:-.4px;margin:0 0 6px;font-weight:800}
.banner p{font-size:12px;line-height:1.4;margin:0 0 10px}
.primary-link{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--orange);font-weight:700;border-radius:8px;padding:8px 12px;font-size:12px;white-space:nowrap}
.discount-art{width:60px;flex:none;display:grid;place-items:center}
.discount-tag{width:48px;height:56px;position:relative;transform:rotate(10deg);background:#fff;color:var(--orange);border-radius:8px;display:grid;place-items:center;box-shadow:0 3px 8px #b6370e33}
.discount-tag span{font-size:22px;font-weight:800}
.section{padding:0 14px 16px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.section-head h2{font-family:Outfit,Inter,sans-serif;font-size:16px;letter-spacing:-.3px;margin:0;font-weight:800}
.text-link{border:0;background:transparent;color:var(--orange);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
.products{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.product{min-width:160px;max-width:170px;flex-shrink:0;border:1px solid #eee;border-radius:14px;padding:12px 10px;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;scroll-snap-align:start}
.product-image{width:100%;height:90px;display:grid;place-items:center;margin-bottom:6px;background:#f8f8f8;border-radius:8px;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:contain}
.product h3{font-size:13px;line-height:1.2;font-weight:600;margin:0 0 3px}
.desc{font-size:10px;color:#999;margin-bottom:4px;line-height:1.2}
.price{font-size:15px;font-weight:800;color:var(--orange);line-height:1.1}
.old-price{font-size:11px;color:#bbb;text-decoration:line-through;margin-top:2px}
.saving{font-size:11px;color:var(--green);font-weight:700;margin-top:2px}
.merchant{font-size:11px;color:#aaa;margin-top:4px}
.product-action{border:0;background:transparent;color:var(--orange);font-size:12px;font-weight:700;padding:0;margin-top:4px}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 14px 20px}
.trust-card{border:1px solid #eee;border-radius:12px;text-align:center;padding:10px 4px;min-width:0}
.trust-icon{font-size:20px;margin-bottom:2px}
.trust-card h3{font-size:11px;margin:0 0 2px;font-weight:700}
.trust-card p{font-size:9px;color:#999;margin:0;line-height:1.2}
.bottom-nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eaeaea;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px max(8px,env(safe-area-inset-bottom));}
.bottom-nav button{border:0;background:transparent;color:#999;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;min-width:0}
.bottom-nav button.active{color:var(--orange)}
.nav-icon{font-size:20px;line-height:1}
.agent{position:fixed;right:12px;bottom:80px;z-index:30}
.agent-button{height:48px;width:48px;border-radius:50%;padding:0;overflow:hidden;border:0;box-shadow:0 3px 12px #0002;background:#eee}
.agent-button img{width:100%;height:100%;object-fit:cover}
.modal{position:fixed;inset:0;z-index:50;background:#0006;display:none;align-items:flex-end}
.modal.open{display:flex}
.modal-panel{background:#fff;width:100%;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px max(16px,env(safe-area-inset-bottom))}
.modal-panel h2{font-family:Outfit,sans-serif;margin:0 0 10px;font-size:18px}
.modal-panel p{line-height:1.4;color:#555;font-size:13px}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.modal-actions button{border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px}
.modal-primary{background:var(--orange);color:#fff}.modal-secondary{background:#f1f1f1;color:#222}
.notice{font-size:10px;color:#999;line-height:1.3;margin-top:8px}
.empty{padding:30px 10px;text-align:center;color:#777;border:1px dashed #ddd;border-radius:12px;min-width:100%;font-size:13px}
.all-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
</style>
</head>
<body>
<header>
  <a class="brand" href="#" id="brandHome" aria-label="Prix Malin, accueil">
    <span class="logo">%</span>
    <span><span class="brand-name">Prix <span>Malin</span></span><span class="tagline" style="display:block">Comparez. Économisez. Malin.</span></span>
  </a>
  <button class="icon-button" id="bell" aria-label="Notifications">🔔</button>
</header>
<main>
  <div class="search-row">
    <form class="search" id="searchForm"><input id="query" type="search" placeholder="Rechercher un produit..." aria-label="Rechercher un produit"><button type="submit" aria-label="Lancer la recherche">🔍</button></form>
    <button class="filter-button" id="filterButton" aria-label="Filtres">☰</button>
  </div>
  <div class="categories" id="categories" aria-label="Catégories">
    <button class="category active" data-category="all"><span class="category-icon">▦</span><span>Toutes</span></button>
    <button class="category" data-category="tech"><span class="category-icon">📱</span><span>Électronique</span></button>
    <button class="category" data-category="fashion"><span class="category-icon">👕</span><span>Mode</span></button>
    <button class="category" data-category="home"><span class="category-icon">🛋️</span><span>Maison</span></button>
    <button class="category" data-category="garden"><span class="category-icon">🌿</span><span>Jardin</span></button>
    <button class="category" data-category="sport"><span class="category-icon">⚽</span><span>Sport</span></button>
    <button class="category" data-category="beauty"><span class="category-icon">💄</span><span>Beauté</span></button>
    <button class="category" data-category="baby"><span class="category-icon">👶</span><span>Bébé</span></button>
  </div>
  <section class="banner" aria-label="Comparer les prix">
    <div class="banner-copy">
      <h1>Trouvez le meilleur prix à chaque fois.</h1>
      <p>Comparez les prix et économisez sur vos achats.</p>
      <a class="primary-link" href="#popular" id="compareButton">Comparer →</a>
    </div>
    <div class="discount-art" aria-hidden="true"><div class="discount-tag"><span>%</span></div></div>
  </section>
  <section class="section" id="popular">
    <div class="section-head"><h2>Produits populaires</h2><button class="text-link" id="seeAll">Voir tout ›</button></div>
    <div class="products" id="products" aria-live="polite"></div>
    <p class="notice">Meilleurs prix du moment. À confirmer sur Amazon. Prix Malin peut percevoir une commission.</p>
  </section>
  <section class="trust" aria-label="Nos engagements">
    <button class="trust-card" data-info="merchants"><div class="trust-icon">🛡️</div><h3>Marchands</h3><p>Liens affiliés</p></button>
    <button class="trust-card" data-info="prices"><div class="trust-icon">🏷️</div><h3>Meilleurs prix</h3><p>Toujours moins cher</p></button>
    <button class="trust-card" data-info="smart"><div class="trust-icon">⭐</div><h3>Achats malins</h3><p>Gratuit</p></button>
  </section>
</main>
<nav class="bottom-nav" aria-label="Navigation principale">
  <button class="active" data-nav="home"><span class="nav-icon">🏠</span><span>Accueil</span></button>
  <button data-nav="categories"><span class="nav-icon">▦</span><span>Catégories</span></button>
  <button data-nav="deals"><span class="nav-icon">🏷️</span><span>Plans</span></button>
  <button data-nav="favorites"><span class="nav-icon">❤️</span><span>Favoris</span></button>
  <button data-nav="account"><span class="nav-icon">👤</span><span>Compte</span></button>
</nav>
<div class="agent"><button class="agent-button" id="agentButton" aria-label="Ouvrir l'assistant Prix Malin"><img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=120&h=120&fit=crop&crop=faces" alt="Assistant"></button></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-panel"><h2 id="modalTitle">Prix Malin</h2><div id="modalContent"></div><div class="modal-actions"><button class="modal-secondary" id="modalClose">Fermer</button></div></div>
</div>
<script>
const AFFILIATE_TAG="prixbasmalin2-21";
const synonyms={
 "pantalon":["jeans","jean","vetement","vêtement","mode","pantalons"],
 "jeans":["pantalon","jean","vetement","vêtement"],
 "vetement":["pantalon","jeans","mode","vêtement","robe","tshirt"],
 "vêtement":["pantalon","jeans","mode","vetement"],
 "chaussure":["basket","baskets","sneakers","sport"],
 "basket":["chaussure","chaussures","sneakers"],
 "baskets":["chaussure","chaussures","sneakers","basket"]
};
const productData=[
 {id:"jeans1",name:"Jeans homme",desc:"Pantalon denim, coupe slim",category:"fashion",query:"jeans pantalon homme",image:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=300&h=300&fit=crop",merchant:"Amazon",price:"24,99€",old:"39,99€",save:"-15€"},
 {id:"jeans2",name:"Pantalon jeans",desc:"Vêtement casual, confort",category:"fashion",query:"pantalon jeans",image:"https://images.unsplash.com/photo-1582418702059-97ebafb35d09?w=300&h=300&fit=crop",merchant:"Amazon",price:"29,99€",old:"49,99€",save:"-20€"},
 {id:"sneakers1",name:"Baskets blanches",desc:"Meilleur prix du moment",category:"fashion",query:"baskets chaussures blanches",image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300&h=300&fit=crop",merchant:"Amazon",price:"39,99€",old:"69,99€",save:"-30€"},
 {id:"sneakers2",name:"Chaussures sport",desc:"Moins cher que chez les concurrents",category:"sport",query:"chaussures baskets sport",image:"https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=300&h=300&fit=crop",merchant:"Amazon",price:"34,99€",old:"59,99€",save:"-25€"},
 {id:"sneakers3",name:"Baskets Nike",desc:"Vertes à petit prix",category:"fashion",query:"baskets nike",image:"https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=300&h=300&fit=crop",merchant:"Amazon",price:"27,99€",old:"49,99€",save:"-22€"},
 {id:"watch",name:"Montre connectée",desc:"Fitness, 7 jours",category:"tech",query:"montre connectée",image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300&h=300&fit=crop",merchant:"Amazon",price:"39,99€",old:"79,99€",save:"-40€"},
 {id:"earbuds",name:"Écouteurs",desc:"Bluetooth anti-bruit",category:"tech",query:"écouteurs sans fil",image:"https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?w=300&h=300&fit=crop",merchant:"Amazon",price:"24,99€",old:"49,99€",save:"-25€"},
 {id:"backpack",name:"Sac à dos",desc:"20L, poche PC",category:"fashion",query:"sac à dos",image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300&h=300&fit=crop",merchant:"Amazon",price:"19,99€",old:"34,99€",save:"-15€"},
 {id:"sofa",name:"Canapé",desc:"2 places, tissu",category:"home",query:"canapé",image:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=300&h=300&fit=crop",merchant:"Amazon",price:"179€",old:"299€",save:"-120€"},
 {id:"gardenchair",name:"Fauteuil jardin",desc:"Résine, résistant",category:"garden",query:"fauteuil jardin",image:"https://images.unsplash.com/photo-1506439773649-6e0eb8cfb237?w=300&h=300&fit=crop",merchant:"Amazon",price:"69,99€",old:"119,99€",save:"-50€"},
 {id:"plants",name:"Plantes d'intérieur",desc:"Set 3 plantes",category:"garden",query:"plantes intérieur",image:"https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=300&h=300&fit=crop",merchant:"Amazon",price:"24,99€",old:"39,99€",save:"-15€"},
 {id:"baby",name:"Accessoires bébé",desc:"Set biberons",category:"baby",query:"accessoires bébé",image:"https://images.unsplash.com/photo-1519689680058-324335c77eba?w=300&h=300&fit=crop",merchant:"Amazon",price:"14,99€",old:"29,99€",save:"-15€"},
 {id:"serum",name:"Sérum visage",desc:"Hydratant, anti-âge",category:"beauty",query:"sérum visage",image:"https://images.unsplash.com/photo-1556228720-195a672e8a03?w=300&h=300&fit=crop",merchant:"Amazon",price:"17,99€",old:"34,99€",save:"-17€"},
 {id:"yoga",name:"Tapis yoga",desc:"Antidérapant, 6mm",category:"sport",query:"tapis yoga",image:"https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=300&h=300&fit=crop",merchant:"Amazon",price:"19,99€",old:"34,99€",save:"-15€"}
];
let activeCategory="all",showingFavorites=false;
let favorites=JSON.parse(localStorage.getItem("prixMalinFavorites")||"[]");
function saveFavorites(){localStorage.setItem("prixMalinFavorites",JSON.stringify(favorites))}
function merchantUrl(p){return "https://www.amazon.fr/s?k="+encodeURIComponent(p.query)+"&tag="+AFFILIATE_TAG}
function productCard(p){
 const isFav=favorites.includes(p.id);
 const card=document.createElement("article");card.className="product";
 const imgWrap=document.createElement("div");imgWrap.className="product-image";
 const img=document.createElement("img");img.src=p.image;img.alt=p.name;img.loading="lazy";img.onerror=function(){this.style.display="none";imgWrap.innerHTML="<span style='font-size:32px'>🛍️</span>"};imgWrap.append(img);
 const title=document.createElement("h3");title.textContent=p.name;
 const desc=document.createElement("div");desc.className="desc";desc.textContent=p.desc;
 const price=document.createElement("div");price.className="price";price.textContent=p.price;
 const old=document.createElement("div");old.className="old-price";old.textContent=p.old;
 const saving=document.createElement("div");saving.className="saving";saving.textContent=p.save;
 const merchant=document.createElement("div");merchant.className="merchant";merchant.textContent=p.merchant;
 const actions=document.createElement("div");actions.style.cssText="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px";
 const buy=document.createElement("a");buy.className="product-action";buy.href=merchantUrl(p);buy.target="_blank";buy.rel="sponsored noopener";buy.textContent="Voir sur Amazon";
 const fav=document.createElement("button");fav.type="button";fav.className="product-action";fav.textContent=isFav?"♥":"♡";fav.onclick=()=>{favorites=isFav?favorites.filter(id=>id!==p.id):[...favorites,p.id];saveFavorites();renderProducts();};
 actions.append(buy,fav);card.append(imgWrap,title,desc,price,old,saving,merchant,actions);return card;
}
function matchesSearch(p,q){
 const text=(p.name+" "+p.query+" "+p.desc+" "+p.category).toLowerCase();
 if(text.includes(q))return true;
 const words=q.split(" ").filter(w=>w.length>2);
 if(words.some(w=>text.includes(w)))return true;
 for(const [key,syns] of Object.entries(synonyms)){
  if(q.includes(key)||syns.some(s=>q.includes(s))){
   if(text.includes(key)||syns.some(s=>text.includes(s)))return true;
  }
 }
 return false;
}
function renderProducts(){
 const el=document.getElementById("products");
 if(!el)return;
 el.innerHTML="";
 let list=productData.filter(p=>activeCategory==="all"||p.category===activeCategory);
 const q=document.getElementById("query").value.trim().toLowerCase();
 if(q)list=list.filter(p=>matchesSearch(p,q));
 if(showingFavorites)list=list.filter(p=>favorites.includes(p.id));
 if(!list.length){el.innerHTML='<div class="empty">Aucun produit trouvé. Essaie pantalon, jeans, baskets, jardin...</div>';return}
 list.slice(0,8).forEach(p=>el.append(productCard(p)));
}
function showAllProducts(){
 const content=document.createElement("div");
 content.className="all-products";
 productData.forEach(p=>content.append(productCard(p)));
 document.getElementById("modalTitle").textContent="Tous les produits";
 document.getElementById("modalContent").innerHTML="";
 document.getElementById("modalContent").append(content);
 document.getElementById("modal").classList.add("open");
}
function openModal(title,text){document.getElementById("modalTitle").textContent=title;document.getElementById("modalContent").innerHTML='<p>'+text+'</p>';document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("searchForm").onsubmit=e=>{e.preventDefault();showingFavorites=false;renderProducts()};
document.getElementById("query").oninput=()=>{showingFavorites=false;renderProducts()};
document.getElementById("categories").onclick=e=>{const btn=e.target.closest("[data-category]");if(!btn)return;activeCategory=btn.dataset.category;showingFavorites=false;document.querySelectorAll(".category").forEach(c=>c.classList.toggle("active",c===btn));renderProducts()};
document.getElementById("filterButton").onclick=()=>openModal("Filtres","Utilise les catégories ou la recherche.");
document.getElementById("compareButton").onclick=()=>document.getElementById("query").focus();
document.getElementById("seeAll").onclick=showAllProducts;
document.getElementById("bell").onclick=()=>openModal("Notifications","Aucune notification.");
document.querySelectorAll(".trust-card").forEach(btn=>btn.onclick=()=>openModal(btn.querySelector("h3").textContent,"Nous cherchons toujours les meilleurs prix pour toi."));
document.querySelector(".bottom-nav").onclick=e=>{const btn=e.target.closest("[data-nav]");if(!btn)return;document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.toggle("active",b===btn));const action=btn.dataset.nav;if(action==="home"){activeCategory="all";showingFavorites=false;document.getElementById("query").value="";renderProducts();window.scrollTo({top:0,behavior:"smooth"})}else if(action==="categories"){document.getElementById("categories").scrollIntoView({behavior:"smooth"})}else if(action==="deals"){openModal("Bons plans","Les meilleurs prix du moment sont déjà affichés.")}else if(action==="favorites"){showingFavorites=true;document.getElementById("query").value="";renderProducts()}else if(action==="account"){openModal("Compte","Pas de compte nécessaire.")}};
document.getElementById("brandHome").onclick=e=>{e.preventDefault();window.scrollTo({top:0,behavior:"smooth"})};
document.getElementById("agentButton").onclick=()=>openModal("Assistant","Dis-moi ce que tu cherches (pantalon, jeans, baskets, jardin...) pour voir les meilleurs prix.");
document.getElementById("modalClose").onclick=closeModal;
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
renderProducts();
</script>
</body>
</html>
