<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prix Malin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#f5f5f5;color:#1a1a1a}
a{text-decoration:none;color:inherit}
header{background:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.left{display:flex;align-items:center;gap:8px}
.logo{width:36px;height:36px;background:#ff5a1f;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:Outfit}
.brand{font-family:Outfit;font-weight:800;font-size:1.2rem}
.brand span{color:#ff5a1f}
.icon-btn{width:36px;height:36px;border-radius:50%;background:#f5f5f5;display:grid;place-items:center}
.banner{margin:16px;background:#ff5a1f;border-radius:18px;padding:22px 20px;color:#fff;position:relative}
.banner h1{font-family:Outfit;font-size:1.45rem;font-weight:800;line-height:1.2;margin-bottom:6px}
.banner p{font-size:.85rem;opacity:.95;margin-bottom:14px}
.banner .pct{position:absolute;right:18px;top:18px;background:#fff;color:#ff5a1f;font-weight:800;font-size:1.4rem;padding:8px 12px;border-radius:10px}
.search{margin:0 16px 14px;background:#fff;border-radius:12px;display:flex;border:1px solid #eee;overflow:hidden}
.search input{flex:1;border:0;padding:13px 14px;font-size:.95rem;outline:0}
.search button{background:#ff5a1f;color:#fff;border:0;padding:0 18px;font-weight:700}
.cats{display:flex;gap:18px;padding:6px 16px 18px;overflow-x:auto}
.cat{text-align:center;min-width:58px}
.cat-box{width:48px;height:48px;background:#fff;border:1px solid #eee;border-radius:14px;display:grid;place-items:center;margin:0 auto 4px;font-size:1.15rem}
.cat span{font-size:.68rem;font-weight:600;color:#666}
.sec{padding:4px 16px 18px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-h h2{font-family:Outfit;font-size:1.05rem;font-weight:700}
.sec-h a{font-size:.78rem;color:#ff5a1f;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.card{background:#fff;border-radius:12px;padding:10px;text-align:center;border:1px solid #eee}
.card .emoji{font-size:1.8rem;margin-bottom:4px}
.card h3{font-size:.72rem;font-weight:600;margin-bottom:2px}
.card .price{font-size:.82rem;font-weight:700;color:#ff5a1f}
.card .old{font-size:.65rem;color:#aaa;text-decoration:line-through}
.card a{display:block;margin-top:6px;background:#1a1a1a;color:#fff;padding:5px;border-radius:6px;font-size:.65rem;font-weight:600}
footer{text-align:center;padding:14px;font-size:.68rem;color:#aaa}
</style>
</head>
<body>
<header>
  <div class="left"><div class="logo">%</div><div class="brand">Prix <span>Malin</span></div></div>
  <div class="icon-btn">🔔</div>
</header>
<div class="banner">
  <div class="pct">%</div>
  <h1>Trouvez le meilleur prix à chaque fois.</h1>
  <p>Comparez les prix de milliers de produits en quelques secondes.</p>
</div>
<form class="search" id="sf">
  <input id="q" placeholder="Rechercher un produit..." required>
  <button>🔍</button>
</form>
<div class="cats">
  <div class="cat"><div class="cat-box">📱</div><span>High-tech</span></div>
  <div class="cat"><div class="cat-box">👕</div><span>Mode</span></div>
  <div class="cat"><div class="cat-box">🛋️</div><span>Maison</span></div>
  <div class="cat"><div class="cat-box">🧴</div><span>Beauté</span></div>
  <div class="cat"><div class="cat-box">👟</div><span>Sport</span></div>
  <div class="cat"><div class="cat-box">👶</div><span>Bébé</span></div>
</div>
<section class="sec">
  <div class="sec-h"><h2>Produits populaires</h2><a href="#">Voir tout ›</a></div>
  <div class="grid" id="prods"></div>
</section>
<section class="sec">
  <div class="sec-h"><h2>Comparer</h2></div>
  <div class="grid" id="results"></div>
</section>
<footer>Prix Malin · Gratuit · © 2026</footer>
<script>
const T="prixbasmalin2-21";
const items=[{n:"Montre",e:"⌚",p:"49,99€",o:"89,99€",q:"montre connectée"},{n:"Écouteurs",e:"🎧",p:"29,99€",o:"59,99€",q:"écouteurs"},{n:"Sac",e:"🎒",p:"24,99€",o:"39,99€",q:"sac à dos"},{n:"Casque",e:"🎧",p:"39,99€",o:"79,99€",q:"casque bluetooth"},{n:"Baskets",e:"👟",p:"34,99€",o:"59,99€",q:"baskets"},{n:"Parfum",e:"💋",p:"19,99€",o:"35€",q:"parfum"}];
const pe=document.getElementById("prods");
items.forEach(x=>{const d=document.createElement("div");d.className="card";d.innerHTML=`<div class="emoji">${x.e}</div><h3>${x.n}</h3><div class="price">${x.p}</div><div class="old">${x.o}</div><a href="https://www.amazon.fr/s?k=${encodeURIComponent(x.q)}&tag=${T}" target="_blank">Voir</a>`;pe.appendChild(d)});
document.getElementById("sf").onsubmit=e=>{e.preventDefault();const q=document.getElementById("q").value.trim();if(!q)return;const r=document.getElementById("results");r.innerHTML="";[{n:"Amazon",u:`https://www.amazon.fr/s?k=${encodeURIComponent(q)}&tag=${T}`},{n:"Google",u:`https://www.google.com/search?tbm=shop&q=${encodeURIComponent(q)}`},{n:"Cdiscount",u:`https://www.cdiscount.com/search/10/${encodeURIComponent(q)}.html`}].forEach(m=>{const d=document.createElement("div");d.className="card";d.innerHTML=`<div class="emoji">🛒</div><h3>${m.n}</h3><a href="${m.u}" target="_blank">Comparer</a>`;r.appendChild(d)})};
</script>
</body>
</html>
