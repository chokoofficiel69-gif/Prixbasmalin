<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fffaf4">
<meta name="description" content="Prix Malin vous aide à comparer rapidement les offres de plusieurs boutiques en ligne.">
<title>Prix Malin — Comparez les offres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf4;--card:#fff;--ink:#202124;--muted:#676b73;--line:#eee5dc;--accent:#f06432;--accent-dark:#d94e20;--soft:#fff0e7;--radius:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
header{padding:14px max(4%,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-family:Outfit,sans-serif;font-size:1.35rem;font-weight:800;display:flex;align-items:center;gap:9px}
.brand-name span{color:var(--accent)}
.logo{width:36px;height:36px;background:var(--accent);border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800}
.header-note{font-size:.78rem;color:var(--muted)}
.hero{max-width:900px;margin:34px auto 22px;padding:0 18px;text-align:center}
.eyebrow{display:inline-block;background:var(--soft);color:var(--accent-dark);font-size:.76rem;font-weight:700;border-radius:99px;padding:6px 11px}
h1{font-family:Outfit,sans-serif;font-size:clamp(2rem,5vw,3.3rem);line-height:1.08;letter-spacing:-.04em;margin:14px 0 12px}
h1 span{color:var(--accent)}
.hero p{color:var(--muted);max-width:620px;margin:0 auto 20px}
.search-bar{display:flex;max-width:700px;margin:0 auto 14px;background:#fff;border:1px solid #e6dcd2;border-radius:15px;padding:5px;box-shadow:0 8px 30px #4b2a1010}
.search-bar input{flex:1;min-width:0;border:0;outline:0;padding:12px;font-size:1rem;background:transparent}
.search-bar button{background:var(--accent);color:#fff;font-weight:700;border-radius:11px;padding:0 22px;min-height:46px;font-family:Outfit,sans-serif;border:0;cursor:pointer}
.cats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px 0}
.cats button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:.85rem;cursor:pointer}
.cats button.active,.cats button:hover{background:var(--soft);border-color:var(--accent)}
main{max-width:1100px;margin:28px auto;padding:0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;min-height:200px}
.merchant-icon{width:46px;height:46px;border-radius:13px;background:var(--soft);color:var(--accent-dark);display:grid;place-items:center;font:800 1rem Outfit,sans-serif;margin-bottom:14px}
.card h3{font:700 1.05rem Outfit,sans-serif;margin:0 0 6px}
.card p{font-size:.85rem;color:var(--muted);margin:0 0 18px;flex:1}
.btn-link{display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;padding:11px 12px;border-radius:10px;font-weight:700;font-size:.86rem}
.welcome{text-align:center;color:var(--muted);padding:28px 10px;background:#fff;border:1px dashed #e4d7cb;border-radius:16px}
footer{text-align:center;padding:24px 16px;color:var(--muted);font-size:.75rem;border-top:1px solid var(--line);margin-top:42px}
</style>
</head>
<body>
<header>
  <a class="brand" href="#"><span class="logo">PM</span><span class="brand-name">Prix <span>Malin</span></span></a>
  <span class="header-note">Comparez les boutiques</span>
</header>
<section class="hero">
  <span class="eyebrow">LE BON RÉFLEXE AVANT D’ACHETER</span>
  <h1>Trouvez le bon produit.<br><span>Comparez les offres.</span></h1>
  <p>Recherchez un produit et comparez les offres chez plusieurs marchands.</p>
  <form class="search-bar" id="searchForm">
    <input id="q" type="search" placeholder="Robe, baskets, casque…" required>
    <button type="submit">Comparer</button>
  </form>
  <div class="cats" id="cats">
    <button class="active" data-cat="">Tous</button>
    <button data-cat="mode">Mode</button>
    <button data-cat="high-tech">High-tech</button>
    <button data-cat="maison">Maison</button>
    <button data-cat="cuisine">Cuisine</button>
    <button data-cat="sport">Sport</button>
    <button data-cat="beauté">Beauté</button>
  </div>
</section>
<main>
  <div id="results" class="grid"></div>
  <div id="welcome" class="welcome">Tape un produit ou choisis une catégorie.</div>
</main>
<footer>Prix Malin · © 2026</footer>
<script>
const AMAZON_TAG = "prixbasmalin2-21";
const merchants = [
  {name:"Amazon",mark:"a",url:q=>"https://www.amazon.fr/s?k="+encodeURIComponent(q)+"&tag="+AMAZON_TAG},
  {name:"Google Shopping",mark:"G",url:q=>"https://www.google.com/search?tbm=shop&q="+encodeURIComponent(q)},
  {name:"Cdiscount",mark:"C",url:q=>"https://www.cdiscount.com/search/10/"+encodeURIComponent(q)+".html"},
  {name:"Fnac",mark:"F",url:q=>"https://www.fnac.com/SearchResult/ResultList.aspx?Search="+encodeURIComponent(q)},
  {name:"eBay",mark:"e",url:q=>"https://www.ebay.fr/sch/i.html?_nkw="+encodeURIComponent(q)}
];
let currentCat = "";
function showResults(query) {
  const results = document.getElementById("results");
  const welcome = document.getElementById("welcome");
  welcome.style.display = "none";
  results.innerHTML = "";
  const q = currentCat ? currentCat + " " + query : query;
  merchants.forEach(m => {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `<div class="merchant-icon">${m.mark}</div><h3>${m.name}</h3><p>Voir les offres pour « ${q} »</p><a class="btn-link" href="${m.url(q)}" target="_blank">Voir les offres</a>`;
    results.appendChild(card);
  });
}
document.getElementById("searchForm").onsubmit = e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (q) showResults(q);
};
document.getElementById("cats").onclick = e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#cats button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  currentCat = e.target.dataset.cat || "";
  const q = document.getElementById("q").value.trim() || currentCat || "produits";
  showResults(q);
};
</script>
</body>
</html>
