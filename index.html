<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prix Malin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--accent:#ff5a1f;--bg:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#f0f0f0}
*{box-sizing:border-box}
body{margin:0;background:#fafafa;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
a{color:inherit;text-decoration:none}
header{padding:12px 16px;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.logo-wrap{display:flex;align-items:center;gap:8px}
.logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem}
.brand{font-family:Outfit;font-weight:800;font-size:1.15rem}
.brand span{color:var(--accent)}
.bell{width:32px;height:32px;border-radius:50%;background:#f5f5f5;display:grid;place-items:center;font-size:.9rem}
.hero-banner{margin:16px;background:linear-gradient(135deg,#ff6b35,#ff5a1f);border-radius:16px;padding:20px;color:#fff;position:relative;overflow:hidden}
.hero-banner h1{font-family:Outfit;font-size:1.5rem;margin:0 0 6px;font-weight:800}
.hero-banner p{margin:0 0 14px;font-size:.85rem;opacity:.95}
.hero-banner .tag{position:absolute;right:16px;top:16px;background:#fff;color:var(--accent);border-radius:8px;padding:6px 10px;font-weight:800;font-size:1.1rem}
.search-wrap{margin:0 16px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;overflow:hidden}
.search-wrap input{flex:1;border:0;padding:12px 14px;font-size:.95rem;outline:0}
.search-wrap button{background:var(--accent);color:#fff;border:0;padding:0 16px;font-weight:700}
.cats{display:flex;gap:16px;padding:0 16px 16px;overflow-x:auto}
.cat{text-align:center;min-width:60px}
.cat-icon{width:48px;height:48px;background:#fff;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;margin:0 auto 4px;font-size:1.2rem}
.cat span{font-size:.7rem;font-weight:600;color:var(--muted)}
.section{padding:8px 16px 20px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-header h2{font-family:Outfit;font-size:1.1rem;margin:0}
.section-header a{font-size:.8rem;color:var(--accent);font-weight:600}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prod{background:#fff;border-radius:12px;padding:12px;text-align:center;border:1px solid var(--line)}
.prod-img{font-size:2rem;margin-bottom:6px}
.prod h3{font-size:.78rem;margin:0 0 2px;font-weight:600}
.prod .price{font-size:.85rem;font-weight:700;color:var(--accent)}
.prod .old{font-size:.7rem;color:#999;text-decoration:line-through}
.prod a{display:block;margin-top:8px;background:#111;color:#fff;padding:6px;border-radius:6px;font-size:.7rem;font-weight:600}
footer{text-align:center;padding:16px;font-size:.7rem;color:#999}
</style>
</head>
<body>
<header>
  <div class="logo-wrap"><div class="logo">%</div><div class="brand">Prix <span>Malin</span></div></div>
  <div class="bell">🔔</div>
</header>
<div class="hero-banner">
  <div class="tag">%</div>
  <h1>Trouvez le meilleur prix à chaque fois.</h1>
  <p>Comparez les prix de milliers de produits en quelques secondes.</p>
</div>
<form class="search-wrap" id="sf">
  <input id="q" placeholder="Rechercher un produit..." required>
  <button type="submit">🔍</button>
</form>
<div class="cats">
  <a class="cat" href="#"><div class="cat-icon">📱</div><span>High-tech</span></a>
  <a class="cat" href="mode.html"><div class="cat-icon">👕</div><span>Mode</span></a>
  <a class="cat" href="#"><div class="cat-icon">🛋️</div><span>Maison</span></a>
  <a class="cat" href="#"><div class="cat-icon">🧴</div><span>Beauté</span></a>
  <a class="cat" href="#"><div class="cat-icon">👟</div><span>Sport</span></a>
  <a class="cat" href="#"><div class="cat-icon">👶</div><span>Bébé</span></a>
</div>
<section class="section">
  <div class="section-header"><h2>Produits populaires</h2><a href="#">Voir tout</a></div>
  <div class="products" id="products"></div>
</section>
<section class="section">
  <div class="section-header"><h2>Résultats</h2></div>
  <div class="products" id="results"></div>
</section>
<footer>Prix Malin · Gratuit · © 2026</footer>
<script>
const TAG="prixbasmalin2-21";
const items=[
  {n:"Montre connectée",i:"⌚",p:"49,99 €",o:"89,99 €",q:"montre connectée"},
  {n:"Écouteurs",i:"🎧",p:"29,99 €",o:"59,99 €",q:"écouteurs bluetooth"},
  {n:"Sac à dos",i:"🎒",p:"24,99 €",o:"39,99 €",q:"sac à dos"},
  {n:"Casque",i:"🎧",p:"39,99 €",o:"79,99 €",q:"casque bluetooth"},
  {n:"Baskets",i:"👟",p:"34,99 €",o:"59,99 €",q:"baskets"},
  {n:"Parfum",i:"💋",p:"19,99 €",o:"35,00 €",q:"parfum"}
];
const pe=document.getElementById("products");
items.forEach(x=>{const d=document.createElement("div");d.className="prod";d.innerHTML=`<div class="prod-img">${x.i}</div><h3>${x.n}</h3><div class="price">${x.p}</div><div class="old">${x.o}</div><a href="https://www.amazon.fr/s?k=${encodeURIComponent(x.q)}&tag=${TAG}" target="_blank">Voir</a>`;pe.appendChild(d)});
document.getElementById("sf").onsubmit=e=>{e.preventDefault();const q=document.getElementById("q").value.trim();if(!q)return;const r=document.getElementById("results");r.innerHTML="";[{n:"Amazon",u:`https://www.amazon.fr/s?k=${encodeURIComponent(q)}&tag=${TAG}`},{n:"Google",u:`https://www.google.com/search?tbm=shop&q=${encodeURIComponent(q)}`},{n:"Cdiscount",u:`https://www.cdiscount.com/search/10/${encodeURIComponent(q)}.html`}].forEach(m=>{const d=document.createElement("div");d.className="prod";d.innerHTML=`<div class="prod-img">🛒</div><h3>${m.n}</h3><a href="${m.u}" target="_blank">Comparer</a>`;r.appendChild(d)})};
</script>
</body>
</html>
