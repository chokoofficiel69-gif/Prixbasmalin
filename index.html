<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prix Malin — Comparateur de prix</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFBF5;--card:#FFFFFF;--ink:#1A1A1A;--muted:#6B6B6B;--line:#F0E6DC;--accent:#FF6B35;--radius:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
header{padding:14px 4%;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{font-family:Outfit,sans-serif;font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:8px}
.brand span{color:var(--accent)}
.logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.9rem}
.layout{display:flex;max-width:1200px;margin:0 auto;padding:16px;gap:20px}
.sidebar{width:180px;flex-shrink:0}
.sidebar h3{font-family:Outfit,sans-serif;font-size:.8rem;font-weight:600;margin:0 0 10px;color:var(--muted);text-transform:uppercase}
.cats{display:flex;flex-direction:column;gap:3px}
.cats a{padding:7px 10px;border-radius:8px;font-size:.88rem;cursor:pointer}
.cats a:hover,.cats a.active{background:#FFF0E6}
.main{flex:1}
.search-bar{display:flex;max-width:560px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.search-bar input{flex:1;border:0;outline:0;padding:11px 12px;font-size:.98rem;background:transparent}
.search-bar button{background:var(--accent);color:#fff;font-weight:600;border-radius:9px;padding:0 16px;min-height:40px;font-family:Outfit,sans-serif;border:0;cursor:pointer}
.agent-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:.9rem}
.agent-avatar{width:36px;height:36px;border-radius:50%;background:#FFD4C2;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);display:flex;flex-direction:column}
.card .img{width:100%;height:130px;background:#F7F7F8;display:flex;align-items:center;justify-content:center;color:#999;font-weight:500;font-size:.82rem}
.info{padding:12px;text-align:center}
.info h3{margin:0 0 8px;font-size:.88rem;font-weight:600;font-family:Outfit,sans-serif}
.btn-link{display:block;background:var(--accent);color:#fff;padding:7px;border-radius:7px;font-weight:600;font-size:.8rem}
.welcome{text-align:center;color:var(--muted);padding:30px 10px}
footer{text-align:center;padding:16px;color:var(--muted);font-size:.7rem;border-top:1px solid var(--line);margin-top:30px}
@media(max-width:700px){.layout{flex-direction:column}.sidebar{width:100%}.cats{flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#">
    <div class="logo">PM</div>
    Prix <span>Malin</span>
  </a>
  <span style="font-size:.72rem;color:var(--accent);font-weight:600">Comparateur</span>
</header>
<div class="layout">
  <aside class="sidebar">
    <h3>Catégories</h3>
    <div class="cats">
      <a class="active">Tous</a>
      <a>Mode</a>
      <a>High-tech</a>
      <a>Maison</a>
      <a>Cuisine</a>
      <a>Sport</a>
      <a>Beauté</a>
    </div>
  </aside>
  <main class="main">
    <form class="search-bar" id="searchForm">
      <input id="q" type="search" placeholder="Robe, baskets, casque…" required>
      <button type="submit">Chercher</button>
    </form>
    <div class="agent-box">
      <div class="agent-avatar">L</div>
      <span>Léa · Dis-moi ce que tu cherches</span>
    </div>
    <div id="results" class="grid"></div>
    <div id="welcome" class="welcome">Tape un produit pour voir les offres.</div>
  </main>
</div>
<footer>Prix Malin · © 2026</footer>
<script>
const TAG = "prixbasmalin2-21";
function showResults(query) {
  const results = document.getElementById("results");
  const welcome = document.getElementById("welcome");
  welcome.style.display = "none";
  results.innerHTML = "";
  const variations = ["", " pas chère", " femme", " homme", " noir", " blanc"];
  variations.forEach(v => {
    const title = query + (v ? v : "");
    const url = "https://www.amazon.fr/s?k=" + encodeURIComponent(title) + "&tag=" + TAG;
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `<div class="img">${title}</div><div class="info"><h3>${title}</h3><a class="btn-link" href="${url}" target="_blank">Voir les offres</a></div>`;
    results.appendChild(card);
  });
}
document.getElementById("searchForm").onsubmit = e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (q) showResults(q);
};
</script>
</body>
</html>
