<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fffaf4">
<title>Prix Malin — Comparez les prix</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--card:#fff;--ink:#111;--muted:#666;--line:#eee;--accent:#ff5a1f;--soft:#fff5f0;--radius:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
header{padding:14px 5%;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.brand{font-family:Outfit;font-size:1.4rem;font-weight:800;display:flex;align-items:center;gap:8px}
.brand span{color:var(--accent)}
.logo{width:34px;height:34px;background:var(--accent);border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800}
.hero{padding:40px 5% 20px;text-align:center;max-width:800px;margin:0 auto}
.hero h1{font-family:Outfit;font-size:clamp(2.2rem,6vw,3.2rem);line-height:1.1;margin:0 0 12px}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);margin:0 0 22px}
.search{display:flex;max-width:560px;margin:0 auto;background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:4px;box-shadow:0 4px 20px #00000008}
.search input{flex:1;border:0;outline:0;padding:14px 16px;font-size:1rem;background:transparent}
.search button{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:0 22px;font-weight:700;cursor:pointer}
.cats{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding:28px 5%}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;width:80px}
.cat-icon{width:52px;height:52px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:1.3rem}
.cat span{font-size:.75rem;font-weight:600}
.section{padding:10px 5% 30px;max-width:1100px;margin:0 auto}
.section h2{font-family:Outfit;font-size:1.3rem;margin:0 0 16px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.prod{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.prod-icon{font-size:2rem;margin-bottom:8px}
.prod h3{font-size:.9rem;margin:0 0 4px;font-weight:600}
.prod p{font-size:.75rem;color:var(--muted);margin:0 0 10px}
.prod a{display:block;background:var(--ink);color:#fff;padding:8px;border-radius:8px;font-size:.78rem;font-weight:600}
footer{text-align:center;padding:20px;color:var(--muted);font-size:.75rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <a class="brand" href="#"><span class="logo">PM</span>Prix <span>Malin</span></a>
  <span style="font-size:.8rem;color:var(--muted)">Gratuit</span>
</header>
<section class="hero">
  <h1>Trouvez le meilleur prix.<br><span>Comparez en un clic.</span></h1>
  <p>Prix Malin est gratuit. Comparez les offres sur Amazon et d'autres sites.</p>
  <form class="search" id="searchForm">
    <input id="q" type="search" placeholder="Que cherchez-vous ?" required>
    <button type="submit">Comparer</button>
  </form>
</section>
<div class="cats">
  <a class="cat" href="mode.html"><div class="cat-icon">👚</div><span>Mode</span></a>
  <a class="cat" href="high-tech.html"><div class="cat-icon">📱</div><span>High-tech</span></a>
  <a class="cat" href="#"><div class="cat-icon">🏠</div><span>Maison</span></a>
  <a class="cat" href="#"><div class="cat-icon">🍳</div><span>Cuisine</span></a>
  <a class="cat" href="#"><div class="cat-icon">⚽</div><span>Sport</span></a>
  <a class="cat" href="#"><div class="cat-icon">💄</div><span>Beauté</span></a>
  <a class="cat" href="#"><div class="cat-icon">🎮</div><span>Jeux</span></a>
  <a class="cat" href="#"><div class="cat-icon">🚗</div><span>Auto</span></a>
</div>
<section class="section">
  <h2>Idées populaires</h2>
  <div class="products" id="products"></div>
</section>
<section class="section">
  <h2>Comparer</h2>
  <div class="products" id="results"></div>
</section>
<footer>Prix Malin · Gratuit · © 2026</footer>
<script>
const TAG = "prixbasmalin2-21";
const ideas = [
  {name:"Survêtement",icon:"👕",q:"survêtement"},
  {name:"Casque BT",icon:"🎧",q:"casque bluetooth"},
  {name:"Robe été",icon:"👗",q:"robe été"},
  {name:"Baskets",icon:"👟",q:"baskets"},
  {name:"Cafetière",icon:"☕",q:"cafetière"},
  {name:"Aspirateur",icon:"🧹",q:"aspirateur"},
  {name:"Montre",icon:"⌚",q:"montre connectée"},
  {name:"Enceinte",icon:"🔊",q:"enceinte bluetooth"}
];
const productsEl = document.getElementById("products");
ideas.forEach(i => {
  const d = document.createElement("div");
  d.className = "prod";
  d.innerHTML = `<div class="prod-icon">${i.icon}</div><h3>${i.name}</h3><p>Comparer les prix</p><a href="https://www.amazon.fr/s?k=${encodeURIComponent(i.q)}&tag=${TAG}" target="_blank">Voir sur Amazon</a>`;
  productsEl.appendChild(d);
});
document.getElementById("searchForm").onsubmit = e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const results = document.getElementById("results");
  results.innerHTML = "";
  const merchants = [
    {name:"Amazon",url:`https://www.amazon.fr/s?k=${encodeURIComponent(q)}&tag=${TAG}`},
    {name:"Google Shopping",url:`https://www.google.com/search?tbm=shop&q=${encodeURIComponent(q)}`},
    {name:"Cdiscount",url:`https://www.cdiscount.com/search/10/${encodeURIComponent(q)}.html`},
    {name:"eBay",url:`https://www.ebay.fr/sch/i.html?_nkw=${encodeURIComponent(q)}`}
  ];
  merchants.forEach(m => {
    const d = document.createElement("div");
    d.className = "prod";
    d.innerHTML = `<div class="prod-icon">🛒</div><h3>${m.name}</h3><p>« ${q} »</p><a href="${m.url}" target="_blank">Voir les offres</a>`;
    results.appendChild(d);
  });
};
</script>
</body>
</html>
